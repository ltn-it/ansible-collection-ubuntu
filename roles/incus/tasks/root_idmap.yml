---
- name: Inspect the subordinate ID file without following links
  ansible.builtin.stat:
    path: "{{ incus_idmap_path }}"
    follow: false
    get_checksum: false
    get_mime: false
  register: incus_idmap_source

- name: Require a regular subordinate ID file
  ansible.builtin.assert:
    that:
      - >-
        not incus_idmap_source.stat.exists
        or (incus_idmap_source.stat.isreg | default(false)
            and not incus_idmap_source.stat.islnk | default(false)
            and incus_idmap_source.stat.nlink | default(0) == 1)
    fail_msg: "Subordinate ID files must be regular files with one link."
    quiet: true

- name: Read existing subordinate ID declarations
  ansible.builtin.slurp:
    src: "{{ incus_idmap_path }}"
  register: incus_idmap_read
  when: incus_idmap_source.stat.exists

- name: Atomically retain one configured owner declaration and unrelated lines
  ansible.builtin.copy:
    dest: "{{ incus_idmap_path }}"
    content: >-
      {{ incus_idmap_remaining
         ~ (incus_idmap_newline
            if incus_idmap_remaining and not incus_idmap_remaining.endswith(incus_idmap_newline) else '')
         ~ incus_root_idmap_owner ~ ':' ~ (incus_root_idmap_start | int | string)
         ~ ':' ~ (incus_root_idmap_count | int | string) ~ incus_idmap_newline }}
    owner: root
    group: root
    mode: "0644"
  vars:
    incus_idmap_newline: "\n"
    incus_idmap_previous: "{{ incus_idmap_read.content | default('') | b64decode }}"
    incus_idmap_remaining: >-
      {{ incus_idmap_previous
         | regex_replace('(?m)^' ~ (incus_root_idmap_owner | regex_escape) ~ ':[^\n]*(?:\n|$)', '') }}
  register: incus_idmap_write
  notify: Restart Incus after subordinate ID changes
