---
argument_specs:
  runtime_packages:
    short_description: Run one explicitly reviewed Incus and container-engine package transaction
    options:
      incus_runtime_packages_request_path:
        type: path
        required: true
      incus_runtime_packages_request_sha256:
        type: str
        required: true
  main:
    short_description: Install and configure Incus on Ubuntu
    options:
      incus_enabled:
        type: bool
        default: true
      incus_packages:
        type: list
        elements: str
        default:
          - bridge-utils
          - incus
          - incus-client
          - qemu-system-x86
          - qemu-utils
          - uidmap
      incus_update_apt_cache:
        type: bool
        default: true
      incus_initialize:
        type: bool
        default: true
      incus_preseed:
        type: dict
        default: {}
      incus_manage_root_idmap:
        type: bool
        default: true
      incus_root_idmap_owner:
        type: str
        default: root
      incus_root_idmap_start:
        type: int
        default: 1000000
      incus_root_idmap_count:
        type: int
        default: 10000000
      incus_root_subuid_path:
        type: path
        default: /etc/subuid
      incus_root_subgid_path:
        type: path
        default: /etc/subgid
      incus_projects:
        type: list
        elements: dict
        default: []
        options:
          name:
            type: str
            required: true
          config:
            type: dict
            default: {}
      incus_profiles:
        type: list
        elements: dict
        default: []
        options:
          name:
            type: str
            required: true
          project:
            type: str
            required: true
          description:
            type: str
            default: ""
          config:
            type: dict
            default: {}
          devices:
            type: dict
            default: {}
      incus_services:
        type: list
        elements: str
        default:
          - incus.socket
          - incus-startup.service
      incus_users:
        type: list
        elements: str
        default: []
      incus_user_groups:
        type: list
        elements: str
        default:
          - incus-admin
          - kvm
