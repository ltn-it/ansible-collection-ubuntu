---
- name: Render host firewall policy in controller memory
  ansible.builtin.set_fact:
    host_firewall_candidate_content: "{{ lookup('ansible.builtin.template', 'host-firewall.nft.j2') }}"

- name: Calculate immutable host firewall policy bindings
  ansible.builtin.set_fact:
    host_firewall_candidate_sha256: "{{ host_firewall_candidate_content | hash('sha256') }}"
    host_firewall_authorization_contract_expected:
      schema: lit.host_firewall.authorization/v2
      target: "{{ host_firewall_expected_inventory_hostname }}"
      action: "{{ host_firewall_action }}"
      candidate_sha256: "{{ host_firewall_candidate_content | hash('sha256') }}"
      approved_readback_sha256: "{{ host_firewall_approved_readback_sha256 }}"
      policy_fingerprint: "{{ host_firewall_policy_fingerprint }}"
      egress_policy_sha256: "{{ host_firewall_egress_policy_sha256 }}"
      egress_status: "{{ host_firewall_egress_status }}"
      change_id: "{{ host_firewall_change_id }}"
    host_firewall_plan:
      schema: lit.host_firewall.plan/v3
      action: "{{ host_firewall_action }}"
      candidate_sha256: "{{ host_firewall_candidate_content | hash('sha256') }}"
      approved_readback_sha256: "{{ host_firewall_approved_readback_sha256 }}"
      policy_fingerprint: "{{ host_firewall_policy_fingerprint }}"
      egress_policy_sha256: "{{ host_firewall_egress_policy_sha256 }}"
      egress_status: "{{ host_firewall_egress_status }}"
      egress_stance: "{{ host_firewall_egress_stance }}"
      mode: "{{ host_firewall_mode }}"
      target: "{{ host_firewall_expected_inventory_hostname }}"
      input_policy: drop
      forward_policy: drop
      output_policy: drop
      ipv4_only: "{{ host_firewall_egress_policy.ipv4_only }}"
      ipv6_forwarding: denied
      new_container_forwarding: >-
        {{
          'restricted'
          if (
            host_firewall_container_service_access
            | dict2items
            | selectattr('value.modes', 'contains', host_firewall_mode)
            | list
            | length
          ) > 0 or (
            host_firewall_published_https_access.enabled
            and host_firewall_mode in host_firewall_public_service_access.https.modes
          )
          else 'denied'
        }}
      persistence_include: "{{ host_firewall_persistent_include_path }}"
      root_persistence_file_owned: false
      signed_authorization_verifier: >-
        {{ 'configured' if host_firewall_authorization_verifier_binary | length > 0 else 'unavailable' }}
      persistent_change: "{{ host_firewall_action == 'confirm' and not ansible_check_mode }}"

- name: Describe the explicitly owned coupled policy scope
  ansible.builtin.set_fact:
    host_firewall_plan: >-
      {{ host_firewall_plan | combine({
          'schema': 'lit.host_firewall.plan/v4',
          'owned_tables': [[host_firewall_table_family, host_firewall_table_name],
                           ['bridge', host_firewall_container_ssh_guard_table_name]],
          'container_ssh_bindings': host_firewall_container_ssh_bindings}) }}
  when: host_firewall_container_ssh_guard_managed

- name: Build candidate-bound transaction request
  ansible.builtin.import_tasks: transaction_request.yml

- name: Report immutable host firewall plan
  ansible.builtin.debug:
    var: host_firewall_plan
