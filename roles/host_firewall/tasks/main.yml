---
- name: Normalize firewall inputs
  ansible.builtin.import_tasks: normalize.yml
  when: host_firewall_enabled | bool
  tags: always

- name: Prechecks
  ansible.builtin.import_tasks: assert.yml
  tags: always

- name: Validate least-privilege egress contract
  ansible.builtin.import_tasks: egress_assert.yml
  when: host_firewall_enabled | bool
  tags: always

- name: End host firewall role when disabled
  ansible.builtin.meta: end_role
  when: not host_firewall_enabled | bool

- name: Verify actual protected control connection
  ansible.builtin.include_tasks: control_connection.yml
  when:
    - host_firewall_action in ['apply', 'confirm', 'rollback']
    - not ansible_check_mode
    - ansible_connection | default('ssh') != 'local'

- name: Discover target-observed container SSH protection before rendering
  ansible.builtin.import_tasks: container_ssh.yml
  when:
    - host_firewall_container_ssh_guard_managed
    - host_firewall_action not in ['rollback', 'readback']

- name: Load protected coupled rollback context without live containers
  ansible.builtin.import_tasks: coupled_rollback_context.yml
  when:
    - host_firewall_container_ssh_guard_managed
    - host_firewall_action == 'rollback'
    - not ansible_check_mode

- name: Render deterministic host firewall candidate
  ansible.builtin.import_tasks: render.yml
  when: not (host_firewall_container_ssh_guard_managed and host_firewall_action in ['rollback', 'readback'])

- name: Freeze the selected transaction bindings for this invocation
  ansible.builtin.set_fact:
    _host_firewall_rollback_bindings:
      candidate: '{{ host_firewall_active_context.candidate_sha256 }}'
      readback: '{{ host_firewall_active_context.approved_readback_sha256 }}'
      fingerprint: '{{ host_firewall_active_context.policy_fingerprint }}'
      change: '{{ host_firewall_active_context.change_id }}'
      mode: '{{ host_firewall_active_context.mode }}'
      egress: '{{ host_firewall_active_context.egress_policy_sha256 }}'
      status: '{{ host_firewall_active_context.egress_status }}'
  when:
    - host_firewall_container_ssh_guard_managed
    - host_firewall_action == 'rollback'
    - not ansible_check_mode

- name: Run the transaction with invocation-scoped bindings
  ansible.builtin.include_role:
    name: host_firewall
    tasks_from: transaction_execute.yml
  vars:
    host_firewall_candidate_sha256: '{{ _host_firewall_rollback_bindings.candidate }}'
    host_firewall_approved_readback_sha256: '{{ _host_firewall_rollback_bindings.readback }}'
    host_firewall_policy_fingerprint: '{{ _host_firewall_rollback_bindings.fingerprint }}'
    host_firewall_change_id: '{{ _host_firewall_rollback_bindings.change }}'
    host_firewall_mode: '{{ _host_firewall_rollback_bindings.mode }}'
    host_firewall_egress_policy_sha256: '{{ _host_firewall_rollback_bindings.egress }}'
    host_firewall_egress_status: '{{ _host_firewall_rollback_bindings.status }}'
  when:
    - host_firewall_container_ssh_guard_managed
    - host_firewall_action == 'rollback'
    - not ansible_check_mode

- name: Execute other actions with their ordinary caller inputs
  ansible.builtin.include_tasks: transaction_execute.yml
  when: >-
    not (host_firewall_container_ssh_guard_managed and host_firewall_action == 'rollback' and not ansible_check_mode)
