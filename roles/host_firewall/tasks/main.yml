---
- name: Normalize firewall inputs
  ansible.builtin.import_tasks: normalize.yml
  when: host_firewall_enabled | bool
  tags: always

- name: Prechecks
  ansible.builtin.import_tasks: assert.yml
  tags: always

- name: Validate least-privilege egress contract
  ansible.builtin.import_tasks: egress_assert.yml
  when: host_firewall_enabled | bool
  tags: always

- name: End host firewall role when disabled
  ansible.builtin.meta: end_role
  when: not host_firewall_enabled | bool

- name: Verify actual protected control connection
  ansible.builtin.include_tasks: control_connection.yml
  when:
    - host_firewall_action in ['apply', 'confirm', 'rollback']
    - not ansible_check_mode
    - ansible_connection | default('ssh') != 'local'

- name: Discover target-observed container SSH protection before rendering
  ansible.builtin.import_tasks: container_ssh.yml
  when:
    - host_firewall_container_ssh_guard_managed
    - host_firewall_action not in ['rollback', 'readback']

- name: Load protected coupled rollback context without live containers
  ansible.builtin.import_tasks: coupled_rollback_context.yml
  when:
    - host_firewall_container_ssh_guard_managed
    - host_firewall_action == 'rollback'
    - not ansible_check_mode

- name: Render deterministic host firewall candidate
  ansible.builtin.import_tasks: render.yml
  when: not (host_firewall_container_ssh_guard_managed and host_firewall_action in ['rollback', 'readback'])

- name: Build candidate-bound controller confirmation
  ansible.builtin.include_tasks: controller_confirmation.yml
  when:
    - host_firewall_authorization_mode == 'controller_confirmation'
    - host_firewall_action in ['apply', 'confirm', 'rollback']
    - not ansible_check_mode

- name: Provision candidate confirmation verifier
  ansible.builtin.include_tasks: controller_verifier_setup.yml
  when:
    - host_firewall_authorization_mode == 'controller_confirmation'
    - host_firewall_action in ['apply', 'confirm', 'rollback']
    - not ansible_check_mode

- name: Validate productive authorization boundary
  ansible.builtin.include_tasks: authorization.yml
  when:
    - host_firewall_action in ['apply', 'confirm', 'rollback']
    - not ansible_check_mode

- name: Derive structured readback in an isolated namespace
  ansible.builtin.include_tasks: preview.yml
  when: host_firewall_action == 'preview'

- name: Verify nftables boot persistence service and include boundary
  ansible.builtin.include_tasks: persistence_preflight.yml
  when:
    - host_firewall_action in ['apply', 'confirm', 'rollback']
    - not ansible_check_mode

- name: Check host firewall candidate without applying it
  ansible.builtin.include_tasks: check.yml
  when: host_firewall_action in ['check', 'apply', 'confirm']

- name: Install static host firewall transaction runtime
  ansible.builtin.include_tasks: setup.yml
  when:
    - host_firewall_action == 'apply'
    - not ansible_check_mode

- name: Validate existing static host firewall transaction runtime
  ansible.builtin.include_tasks: runtime_preflight.yml
  when:
    - host_firewall_action in ['confirm', 'rollback']
    - not ansible_check_mode

- name: Apply host firewall transaction
  ansible.builtin.include_tasks: apply.yml
  when:
    - host_firewall_action == 'apply'
    - not ansible_check_mode

- name: Report check-mode apply hold
  ansible.builtin.debug:
    msg: >-
      Check mode validated the candidate only. No firewall, watchdog, state, or persistent configuration was changed.
  when:
    - host_firewall_action == 'apply'
    - ansible_check_mode

- name: Confirm host firewall transaction
  ansible.builtin.include_tasks: confirm.yml
  when:
    - host_firewall_action == 'confirm'
    - not ansible_check_mode

- name: Report check-mode confirmation hold
  ansible.builtin.debug:
    msg: "Check mode did not persist or confirm the pending firewall transaction."
  when:
    - host_firewall_action == 'confirm'
    - ansible_check_mode

- name: Roll back host firewall transaction
  ansible.builtin.include_tasks: rollback.yml
  when:
    - host_firewall_action == 'rollback'
    - not ansible_check_mode

- name: Report check-mode rollback hold
  ansible.builtin.debug:
    msg: "Check mode did not execute the rollback service or alter persistent configuration."
  when:
    - host_firewall_action == 'rollback'
    - ansible_check_mode

- name: Read back current host firewall table
  ansible.builtin.include_tasks: readback.yml
  when:
    - host_firewall_action == 'readback'
    - not host_firewall_container_ssh_guard_managed

- name: Read back the complete coupled host firewall policy
  ansible.builtin.include_tasks: coupled_readback.yml
  when:
    - host_firewall_action == 'readback'
    - host_firewall_container_ssh_guard_managed
