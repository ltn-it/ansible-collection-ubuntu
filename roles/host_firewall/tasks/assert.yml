---
- name: Validate host firewall base inputs
  ansible.builtin.assert:
    that:
      - host_firewall_enabled is boolean
      - host_firewall_action in ['plan', 'preview', 'check', 'apply', 'confirm', 'rollback', 'readback']
      - host_firewall_mode in ['bootstrap', 'hardened']
      - host_firewall_positive_tests_passed is boolean
      - host_firewall_negative_tests_passed is boolean
      - host_firewall_authorization_contract is mapping
      - host_firewall_egress_policy is mapping
      - host_firewall_container_ssh_access is mapping
      - host_firewall_container_ssh_guard_managed is boolean
      - host_firewall_cis_ipv6_required is boolean
      - host_firewall_provider_ipv6_filter_enabled is boolean
      - >-
        not host_firewall_provider_ipv6_filter_enabled
        or host_firewall_provider_ipv6_filter_evidence_reference | trim | length >= 8
    fail_msg: "Host firewall base variables are invalid."

- name: Require explicit ownership for container SSH ingress protection
  ansible.builtin.assert:
    that:
      - host_firewall_container_ssh_access | length == 0 or host_firewall_container_ssh_guard_managed
      - >-
        host_firewall_container_ssh_guard_table_name is string
        and host_firewall_container_ssh_guard_table_name is match('^[a-z][a-z0-9_]{2,31}\Z')
      - >-
        host_firewall_container_ssh_access | dict2items
        | map(attribute='value.interface') | difference(host_firewall_container_interfaces) | length == 0
    fail_msg: "Container SSH requires an explicitly managed guard and selected managed bridges."
  when: host_firewall_enabled | bool

- name: Validate enabled host firewall identity and platform
  ansible.builtin.assert:
    that:
      - host_firewall_expected_inventory_hostname | trim | length > 0
      - host_firewall_expected_inventory_hostname | length <= 253
      - >-
        host_firewall_expected_inventory_hostname
        is match('^[A-Za-z0-9](?:[A-Za-z0-9.-]*[A-Za-z0-9])?\Z')
      - inventory_hostname == host_firewall_expected_inventory_hostname
      - host_firewall_platform_name == 'Ubuntu'
      - host_firewall_platform_version is match('^24\.04(?:\.[0-9]+)?\Z')
      - host_firewall_observed_ipv4_addresses is sequence
      - host_firewall_observed_ipv4_addresses is not string
      - host_firewall_observed_ipv6_addresses is sequence
      - host_firewall_observed_ipv6_addresses is not string
      - host_firewall_expected_public_ipv4 is match(host_firewall_ipv4_pattern)
      - host_firewall_expected_management_ipv4 is match(host_firewall_ipv4_pattern)
      - host_firewall_expected_public_ipv4 != host_firewall_expected_management_ipv4
      - host_firewall_expected_public_ipv4 in host_firewall_observed_ipv4_addresses
      - host_firewall_expected_management_ipv4 in host_firewall_observed_ipv4_addresses
      - >-
        host_firewall_expected_public_ipv6 | length == 0
        or (
          ':' in host_firewall_expected_public_ipv6
          and host_firewall_expected_public_ipv6 == host_firewall_expected_public_ipv6 | lower
        )
      - >-
        host_firewall_expected_management_ipv6 | length == 0
        or (
          ':' in host_firewall_expected_management_ipv6
          and host_firewall_expected_management_ipv6 == host_firewall_expected_management_ipv6 | lower
        )
      - >-
        host_firewall_expected_public_ipv6 | length == 0
        or host_firewall_expected_public_ipv6 in host_firewall_observed_ipv6_addresses
      - >-
        host_firewall_expected_management_ipv6 | length == 0
        or host_firewall_expected_management_ipv6 in host_firewall_observed_ipv6_addresses
      - >-
        host_firewall_expected_public_ipv6 | length == 0
        or host_firewall_expected_public_ipv6 != host_firewall_expected_management_ipv6
    fail_msg: >-
      Target identity is ambiguous or does not match an Ubuntu 24.04 host with the expected IPv4/IPv6 addresses.
  when: host_firewall_enabled | bool

- name: Reject ambiguous deprecated aggregate source inputs
  ansible.builtin.assert:
    that:
      - host_firewall_controller_source_cidrs | length == 0
      - host_firewall_recovery_source_cidrs | length == 0
      - host_firewall_tang_consumer_cidrs | length == 0
    fail_msg: >-
      Aggregate source variables are no longer safe because they imply cross-port access. Migrate every source to
      host_firewall_management_access.<function>.sources_ipv4/sources_ipv6 or host_firewall_tang_access.
  when: host_firewall_enabled | bool

- name: Validate exact management function inventory
  ansible.builtin.assert:
    that:
      - host_firewall_management_access is mapping
      - >-
        host_firewall_management_access.keys() | list | sort
        == host_firewall_management_access_contract.keys() | list | sort
    fail_msg: >-
      Management access must contain exactly bootstrap_ssh, openssh, and dropbear; arbitrary functions are rejected.
  when: host_firewall_enabled | bool

- name: Validate each management function contract
  ansible.builtin.assert:
    that:
      - item.value is mapping
      - item.value.keys() | list | sort == ['modes', 'port', 'sources_ipv4', 'sources_ipv6']
      - item.value.port is integer
      - item.value.port == host_firewall_management_access_contract[item.key].port
      - item.value.modes == host_firewall_management_access_contract[item.key].modes
      - item.value.sources_ipv4 is sequence
      - item.value.sources_ipv4 is not string
      - item.value.sources_ipv6 is sequence
      - item.value.sources_ipv6 is not string
      - item.value.sources_ipv4 | unique | list | length == item.value.sources_ipv4 | length
      - item.value.sources_ipv6 | unique | list | length == item.value.sources_ipv6 | length
    fail_msg: "A management function changed its fixed port/mode contract or contains malformed source lists."
  loop: "{{ host_firewall_management_access | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: host_firewall_enabled | bool

- name: Validate every per-function IPv4 source as an exact host
  ansible.builtin.assert:
    that:
      - item.1 is match(host_firewall_ipv4_host_cidr_pattern)
    fail_msg: "Management IPv4 sources must be exact /32 values."
  loop: >-
    {{
      query(
        'ansible.builtin.subelements',
        host_firewall_management_access | dict2items,
        'value.sources_ipv4',
        {'skip_missing': false}
      )
    }}
  loop_control:
    label: "{{ item.0.key }}={{ item.1 }}"
  when: host_firewall_enabled | bool

- name: Validate every per-function IPv6 source as an exact host
  ansible.builtin.assert:
    that:
      - item.1 is match(host_firewall_ipv6_host_cidr_pattern)
      - host_firewall_host_ipv6_addresses_effective | length > 0
    fail_msg: >-
      Management IPv6 sources must be canonical compressed /128 values and require an expected host IPv6 address.
  loop: >-
    {{
      query(
        'ansible.builtin.subelements',
        host_firewall_management_access | dict2items,
        'value.sources_ipv6',
        {'skip_missing': false}
      )
    }}
  loop_control:
    label: "{{ item.0.key }}={{ item.1 }}"
  when: host_firewall_enabled | bool

- name: Validate public service inventory
  ansible.builtin.assert:
    that:
      - host_firewall_public_service_access is mapping
      - item.key is match('^[a-z][a-z0-9_]{1,31}\Z')
      - item.value is mapping
      - >-
        item.value.keys() | list | sort
        == ['modes', 'port', 'protocol', 'sources_ipv4', 'sources_ipv6']
      - item.value.protocol in ['tcp', 'udp']
      - item.value.port is integer
      - item.value.port >= 1
      - item.value.port <= 65535
      - item.value.modes is sequence
      - item.value.modes is not string
      - item.value.modes | length > 0
      - item.value.modes | difference(['bootstrap', 'hardened']) | length == 0
      - item.value.sources_ipv4 is sequence
      - item.value.sources_ipv4 is not string
      - item.value.sources_ipv6 is sequence
      - item.value.sources_ipv6 is not string
      - item.value.sources_ipv4 | length + item.value.sources_ipv6 | length > 0
      - item.value.sources_ipv4 | unique | list | length == item.value.sources_ipv4 | length
      - item.value.sources_ipv6 | unique | list | length == item.value.sources_ipv6 | length
    fail_msg: >-
      Public services require a safe function name, fixed TCP/UDP port,
      explicit bootstrap/hardened modes, and unique exact-host sources.
  loop: "{{ host_firewall_public_service_access | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: host_firewall_enabled | bool

- name: Validate every public service IPv4 source as an exact host
  ansible.builtin.assert:
    that:
      - item.1 is match(host_firewall_ipv4_host_cidr_pattern)
    fail_msg: "Public service IPv4 sources must be exact /32 values."
  loop: >-
    {{
      query(
        'ansible.builtin.subelements',
        host_firewall_public_service_access | dict2items,
        'value.sources_ipv4',
        {'skip_missing': false}
      )
    }}
  loop_control:
    label: "{{ item.0.key }}={{ item.1 }}"
  when: host_firewall_enabled | bool

- name: Reject IPv6 public service sources for the IPv4-only baseline
  ansible.builtin.assert:
    that:
      - item.value.sources_ipv6 | length == 0
    fail_msg: "Public service IPv6 sources violate the end-to-end IPv4-only baseline."
  loop: "{{ host_firewall_public_service_access | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: host_firewall_enabled | bool

- name: Validate Tang function contract
  ansible.builtin.assert:
    that:
      - host_firewall_tang_access is mapping
      - host_firewall_tang_access.keys() | list | sort == ['port', 'sources_ipv4', 'sources_ipv6']
      - host_firewall_tang_access.port is integer
      - host_firewall_tang_access.port == 80
      - host_firewall_tang_access.sources_ipv4 is sequence
      - host_firewall_tang_access.sources_ipv4 is not string
      - host_firewall_tang_access.sources_ipv6 is sequence
      - host_firewall_tang_access.sources_ipv6 is not string
      - >-
        host_firewall_tang_access.sources_ipv4 | length + host_firewall_tang_access.sources_ipv6 | length
        == host_firewall_expected_tang_consumer_count
      - >-
        host_firewall_tang_access.sources_ipv4 | unique | list | length
        == host_firewall_tang_access.sources_ipv4 | length
      - >-
        host_firewall_tang_access.sources_ipv6 | unique | list | length
        == host_firewall_tang_access.sources_ipv6 | length
    fail_msg: "Tang must use fixed TCP 80 and the exact approved number of unique IPv4/IPv6 consumer hosts."
  when: host_firewall_enabled | bool

- name: Validate every Tang IPv4 source as an exact host
  ansible.builtin.assert:
    that:
      - item is match(host_firewall_ipv4_host_cidr_pattern)
    fail_msg: "Tang IPv4 consumers must be exact /32 values."
  loop: "{{ host_firewall_tang_access.sources_ipv4 }}"
  loop_control:
    label: "{{ item }}"
  when: host_firewall_enabled | bool

- name: Validate every Tang IPv6 source as an exact host
  ansible.builtin.assert:
    that:
      - item is match(host_firewall_ipv6_host_cidr_pattern)
      - host_firewall_expected_public_ipv6 | length > 0
    fail_msg: "Tang IPv6 consumers must be canonical compressed /128 values and require the public host IPv6."
  loop: "{{ host_firewall_tang_access.sources_ipv6 }}"
  loop_control:
    label: "{{ item }}"
  when: host_firewall_enabled | bool

- name: Validate host firewall interface inputs
  ansible.builtin.assert:
    that:
      - host_firewall_public_interface is match('^[A-Za-z0-9_.:-]{1,15}\Z')
      - host_firewall_management_interface is match('^[A-Za-z0-9_.:-]{1,15}\Z')
      - host_firewall_public_interface != host_firewall_management_interface
      - host_firewall_container_interfaces is sequence
      - host_firewall_container_interfaces is not string
      - host_firewall_container_interfaces | length > 0
      - host_firewall_container_interfaces | unique | list | length == host_firewall_container_interfaces | length
      - host_firewall_public_interface not in host_firewall_container_interfaces
      - host_firewall_management_interface not in host_firewall_container_interfaces
    fail_msg: "Public, management, and container interface identities must be explicit, distinct, and complete."
  when: host_firewall_enabled | bool

- name: Validate every host firewall container interface
  ansible.builtin.assert:
    that:
      - item is match('^[A-Za-z0-9_.:-]{1,15}\Z')
    fail_msg: "Container interface names must be exact Linux interface names without patterns or control characters."
  loop: "{{ host_firewall_container_interfaces }}"
  loop_control:
    label: "{{ item }}"
  when: host_firewall_enabled | bool

- name: Validate published container HTTPS boundaries
  ansible.builtin.import_tasks: published_https_assert.yml
  when: host_firewall_enabled | bool

- name: Validate exact container service inventory
  ansible.builtin.assert:
    that:
      - host_firewall_container_service_access is mapping
      - item.key is match('^[a-z][a-z0-9_]{1,31}\Z')
      - item.value is mapping
      - >-
        item.value.keys() | list | sort
        == ['destination_interface', 'destinations_ipv4', 'interfaces', 'modes', 'port', 'protocol', 'sources_ipv4']
      - item.value.interfaces is sequence
      - item.value.interfaces is not string
      - item.value.interfaces | length > 0
      - item.value.interfaces | unique | list | length == item.value.interfaces | length
      - item.value.interfaces | difference(host_firewall_container_interfaces) | length == 0
      - item.value.destination_interface == host_firewall_management_interface
      - item.value.protocol in ['tcp', 'udp']
      - item.value.port is integer
      - item.value.port >= 1
      - item.value.port <= 65535
      - item.value.modes is sequence
      - item.value.modes is not string
      - item.value.modes | length > 0
      - item.value.modes | difference(['bootstrap', 'hardened']) | length == 0
      - item.value.sources_ipv4 is sequence
      - item.value.sources_ipv4 is not string
      - item.value.sources_ipv4 | length > 0
      - item.value.sources_ipv4 | unique | list | length == item.value.sources_ipv4 | length
      - item.value.destinations_ipv4 is sequence
      - item.value.destinations_ipv4 is not string
      - item.value.destinations_ipv4 | length > 0
      - item.value.destinations_ipv4 | unique | list | length == item.value.destinations_ipv4 | length
    fail_msg: >-
      Container services require exact container interfaces and /32 endpoints,
      the management destination interface, fixed TCP/UDP port, and explicit modes.
  loop: "{{ host_firewall_container_service_access | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: host_firewall_enabled | bool

- name: Validate every container service source as an exact IPv4 host
  ansible.builtin.assert:
    that:
      - item.1 is match(host_firewall_ipv4_host_cidr_pattern)
    fail_msg: "Container service sources must be exact IPv4 /32 values."
  loop: >-
    {{
      query(
        'ansible.builtin.subelements',
        host_firewall_container_service_access | dict2items,
        'value.sources_ipv4',
        {'skip_missing': false}
      )
    }}
  loop_control:
    label: "{{ item.1 }}"
  when: host_firewall_enabled | bool

- name: Validate every container service destination as an exact IPv4 host
  ansible.builtin.assert:
    that:
      - item.1 is match(host_firewall_ipv4_host_cidr_pattern)
    fail_msg: "Container service destinations must be exact IPv4 /32 values."
  loop: >-
    {{
      query(
        'ansible.builtin.subelements',
        host_firewall_container_service_access | dict2items,
        'value.destinations_ipv4',
        {'skip_missing': false}
      )
    }}
  loop_control:
    label: "{{ item.1 }}"
  when: host_firewall_enabled | bool

- name: Validate host firewall table, transaction, and command inputs
  ansible.builtin.assert:
    that:
      - host_firewall_table_family == 'inet'
      - host_firewall_table_name is match('^[a-z][a-z0-9_]{2,31}\Z')
      - host_firewall_input_priority | int >= 1
      - host_firewall_input_priority | int <= 50
      - host_firewall_forward_priority | int >= 1
      - host_firewall_forward_priority | int <= 50
      - host_firewall_output_priority | int >= 1
      - host_firewall_output_priority | int <= 50
      - host_firewall_watchdog_timeout_seconds | int >= 60
      - host_firewall_watchdog_timeout_seconds | int <= 900
      - host_firewall_command_timeout_seconds | int >= 5
      - host_firewall_command_timeout_seconds | int <= 60
      - host_firewall_lock_wait_timeout_seconds | int >= 1
      - host_firewall_lock_wait_timeout_seconds | int <= 60
      - >-
        (host_firewall_command_timeout_seconds | int) * 2 + 5
        < (host_firewall_watchdog_timeout_seconds | int)
      - >-
        (host_firewall_lock_wait_timeout_seconds | int) + 5
        < (host_firewall_watchdog_timeout_seconds | int)
      - host_firewall_rollback_service_name is match('^[A-Za-z0-9_.@-]+\.service\Z')
      - host_firewall_rollback_timer_name is match('^[A-Za-z0-9_.@-]+\.timer\Z')
      - host_firewall_confirmation_service_name is match('^[A-Za-z0-9_.@-]+\.service\Z')
      - host_firewall_confirmation_service_name != host_firewall_rollback_service_name
      - host_firewall_persistence_service_name is match('^[A-Za-z0-9_.@-]+\.service\Z')
      - host_firewall_confirmation_service_name != host_firewall_persistence_service_name
      - host_firewall_rollback_service_name != host_firewall_persistence_service_name
      - host_firewall_nft_binary is match('^/[A-Za-z0-9_./-]+\Z')
      - host_firewall_systemctl_binary is match('^/[A-Za-z0-9_./-]+\Z')
      - host_firewall_python_binary is match('^/[A-Za-z0-9_./-]+\Z')
      - host_firewall_printenv_binary is match('^/[A-Za-z0-9_./-]+\Z')
      - >-
        host_firewall_authorization_verifier_binary | length == 0
        or host_firewall_authorization_verifier_binary is match('^/[A-Za-z0-9_./-]+\Z')
    fail_msg: "Firewall table, priority, watchdog, unit, or command inputs are invalid."
  when: host_firewall_enabled | bool

- name: Validate every managed host firewall path
  ansible.builtin.assert:
    that:
      - item is match('^/[A-Za-z0-9_./-]+\Z')
      - item != '/'
      - "'..' not in item.split('/')"
      - "'//' not in item"
    fail_msg: "Managed firewall paths must be explicit absolute paths without traversal or control characters."
  loop:
    - "{{ host_firewall_state_directory }}"
    - "{{ host_firewall_transactions_directory }}"
    - "{{ host_firewall_claims_directory }}"
    - "{{ host_firewall_active_transaction_path }}"
    - "{{ host_firewall_transaction_lock_path }}"
    - "{{ host_firewall_persistent_root_config_path }}"
    - "{{ host_firewall_persistent_include_path }}"
    - "{{ host_firewall_systemd_unit_directory }}"
    - "{{ host_firewall_transaction_program_path }}"
    - "{{ host_firewall_systemd_unit_directory }}/{{ host_firewall_confirmation_service_name }}"
    - "{{ host_firewall_systemd_unit_directory }}/{{ host_firewall_rollback_service_name }}"
    - "{{ host_firewall_systemd_unit_directory }}/{{ host_firewall_rollback_timer_name }}"
  loop_control:
    label: "{{ item }}"
  when: host_firewall_enabled | bool

- name: Validate host firewall state ownership boundaries
  ansible.builtin.assert:
    that:
      - host_firewall_transactions_directory | dirname == host_firewall_state_directory
      - host_firewall_claims_directory | dirname == host_firewall_state_directory
      - host_firewall_active_transaction_path | dirname == host_firewall_state_directory
      - host_firewall_transaction_lock_path | dirname == host_firewall_state_directory
    fail_msg: "Transaction directories, active pointer, and lock must be direct children of the state directory."
  when: host_firewall_enabled | bool

- name: Require pairwise-distinct configured firewall paths
  ansible.builtin.assert:
    that:
      - _host_firewall_configured_paths | unique | list | length == _host_firewall_configured_paths | length
    fail_msg: >-
      State, transaction, claim, active, lock, persistence, program, and unit paths must be pairwise distinct.
  vars:
    _host_firewall_configured_paths:
      - "{{ host_firewall_state_directory }}"
      - "{{ host_firewall_transactions_directory }}"
      - "{{ host_firewall_claims_directory }}"
      - "{{ host_firewall_active_transaction_path }}"
      - "{{ host_firewall_transaction_lock_path }}"
      - "{{ host_firewall_persistent_root_config_path }}"
      - "{{ host_firewall_persistent_include_path }}"
      - "{{ host_firewall_transaction_program_path }}"
      - "{{ host_firewall_systemd_unit_directory }}"
      - "{{ host_firewall_systemd_unit_directory }}/{{ host_firewall_confirmation_service_name }}"
      - "{{ host_firewall_systemd_unit_directory }}/{{ host_firewall_rollback_service_name }}"
      - "{{ host_firewall_systemd_unit_directory }}/{{ host_firewall_rollback_timer_name }}"
      - "{{ host_firewall_systemd_unit_directory }}/{{ host_firewall_persistence_service_name }}"
      - "{{ host_firewall_nft_binary }}"
      - "{{ host_firewall_systemctl_binary }}"
      - >-
        {{
          host_firewall_authorization_verifier_binary
          if host_firewall_authorization_verifier_binary | length > 0
          else '/-'
        }}
  when: host_firewall_enabled | bool

- name: Validate isolated persistence boundary
  ansible.builtin.assert:
    that:
      - host_firewall_persistent_include_path != host_firewall_persistent_root_config_path
      - host_firewall_persistent_include_path | dirname != host_firewall_persistent_root_config_path | dirname
      - host_firewall_persistent_include_directive == 'include "' + host_firewall_persistent_include_path + '"'
    fail_msg: "The role-owned persistence include must be isolated from the administrator-owned root configuration."
  when: host_firewall_enabled | bool

- name: Validate active control connection protection
  ansible.builtin.assert:
    that:
      - _host_firewall_control_matches | length == 1
      - host_firewall_mode in _host_firewall_control_service.value.modes
      - _host_firewall_control_cidr in _host_firewall_control_sources
    fail_msg: >-
      The active control source and destination port must match one explicit per-function authorization.
  vars:
    _host_firewall_control_matches: >-
      {{
        host_firewall_management_access
        | dict2items
        | selectattr('value.port', 'equalto', host_firewall_control_destination_port | int)
        | list
      }}
    _host_firewall_control_service: >-
      {{
        _host_firewall_control_matches
        | first
        | default({'value': {'modes': [], 'sources_ipv4': [], 'sources_ipv6': []}})
      }}
    _host_firewall_control_cidr: >-
      {{
        host_firewall_control_source_address
        + ('/128' if ':' in host_firewall_control_source_address else '/32')
      }}
    _host_firewall_control_sources: >-
      {{
        _host_firewall_control_service.value.sources_ipv6
        if ':' in host_firewall_control_source_address
        else _host_firewall_control_service.value.sources_ipv4
      }}
  when:
    - host_firewall_enabled | bool
    - host_firewall_action in ['apply', 'confirm', 'rollback']
    - not ansible_check_mode

- name: Validate productive action identifiers
  ansible.builtin.assert:
    that:
      - host_firewall_change_id is match('^[A-Za-z0-9][A-Za-z0-9._-]{2,63}\Z')
      - host_firewall_approved_readback_sha256 is match('^[a-f0-9]{64}\Z')
    fail_msg: "A productive action requires an immutable change ID and an independently approved canonical readback."
  when:
    - host_firewall_enabled | bool
    - host_firewall_action in ['apply', 'confirm', 'rollback']
    - not ansible_check_mode

- name: Validate host firewall confirmation evidence
  ansible.builtin.assert:
    that:
      - host_firewall_positive_tests_passed | bool
      - host_firewall_negative_tests_passed | bool
      - host_firewall_test_evidence_reference | length <= 512
      - >-
        host_firewall_test_evidence_reference
        is match('^[A-Za-z0-9][A-Za-z0-9:/?&._#=@+-]{7,511}\Z')
    fail_msg: "Confirmation requires external positive and negative test evidence."
  when:
    - host_firewall_enabled | bool
    - host_firewall_action == 'confirm'
    - not ansible_check_mode

- name: Require approved deny-by-default egress for confirmation
  ansible.builtin.assert:
    that:
      - host_firewall_mode == 'hardened'
      - host_firewall_egress_status == 'approved'
      - host_firewall_egress_stance == 'deny-by-default'
      - not host_firewall_egress_policy.functions.bootstrap_https.enabled | bool
    fail_msg: >-
      Productive confirmation requires hardened mode and the approved deny-by-default egress baseline. A bootstrap
      HTTPS maintenance exception can be applied only under watchdog protection and can never be confirmed.
  when:
    - host_firewall_enabled | bool
    - host_firewall_action == 'confirm'
    - not ansible_check_mode
