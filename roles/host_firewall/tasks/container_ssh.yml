---
- name: Discover actual active container namespace and host ingress bindings
  ansible.builtin.command:
    argv:
      - '{{ host_firewall_python_binary }}'
      - -c
      - "{{ lookup('ansible.builtin.file', role_path + '/files/container_ssh_binding.py') }}"
      - --discover
    stdin: >-
      {{ {'capabilities': host_firewall_container_ssh_access,
          'mode': host_firewall_mode,
          'table_name': host_firewall_container_ssh_guard_table_name} | to_json }}
  register: host_firewall_container_ssh_discovery_command
  changed_when: false
  check_mode: false

- name: Parse target-observed container SSH discovery
  ansible.builtin.set_fact:
    host_firewall_container_ssh_discovery: '{{ host_firewall_container_ssh_discovery_command.stdout | from_json }}'

- name: Require the exact read-only discovery contract
  ansible.builtin.assert:
    that:
      - host_firewall_container_ssh_discovery.schema == 'lit.host_firewall.container-ssh-binding/v1'
      - host_firewall_container_ssh_discovery.mutations is sameas false
      - host_firewall_container_ssh_discovery.transactional_installation_required is sameas true
      - host_firewall_container_ssh_discovery.bindings is mapping
      - >-
        host_firewall_container_ssh_discovery.guard | hash('sha256')
        == host_firewall_container_ssh_discovery.guard_sha256

- name: Bind only the actual discovered container ingress and complete guard
  ansible.builtin.set_fact:
    host_firewall_container_ssh_bindings: '{{ host_firewall_container_ssh_discovery.bindings }}'
    host_firewall_container_ssh_guard_content: '{{ host_firewall_container_ssh_discovery.guard }}'
