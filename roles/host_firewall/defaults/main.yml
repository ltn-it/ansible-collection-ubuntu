---
host_firewall_enabled: false
host_firewall_action: plan
host_firewall_mode: bootstrap

host_firewall_expected_inventory_hostname: ""
host_firewall_expected_public_ipv4: ""
host_firewall_expected_management_ipv4: ""
host_firewall_expected_public_ipv6: ""
host_firewall_expected_management_ipv6: ""
host_firewall_observed_ipv4_addresses: "{{ ansible_facts['all_ipv4_addresses'] | default([]) }}"
host_firewall_observed_ipv6_addresses: "{{ ansible_facts['all_ipv6_addresses'] | default([]) }}"
# Read-only discovery must bind every managed container bridge to its actual
# IPv4 gateway before container DNS can be enabled. A generic observed host
# address is not sufficient evidence for this security boundary.
host_firewall_observed_container_bridge_gateways_ipv4: {}
host_firewall_platform_name: "{{ ansible_facts['distribution'] | default('') }}"
host_firewall_platform_version: "{{ ansible_facts['distribution_version'] | default('') }}"

host_firewall_public_interface: ""
host_firewall_management_interface: ""
host_firewall_container_interfaces:
  - podman0

# Management authorization is deliberately expressed per function and address family. A source may occur in
# several functions without creating an implicit cross-port grant.
host_firewall_management_access:
  bootstrap_ssh:
    port: 22
    modes:
      - bootstrap
    sources_ipv4: []
    sources_ipv6: []
  openssh:
    port: 1905
    modes:
      - bootstrap
      - hardened
    sources_ipv4: []
    sources_ipv6: []
  dropbear:
    port: 2222
    modes:
      - bootstrap
      - hardened
    sources_ipv4: []
    sources_ipv6: []

host_firewall_management_access_contract:
  bootstrap_ssh:
    port: 22
    modes:
      - bootstrap
  openssh:
    port: 1905
    modes:
      - bootstrap
      - hardened
  dropbear:
    port: 2222
    modes:
      - bootstrap
      - hardened

host_firewall_tang_access:
  port: 80
  sources_ipv4: []
  sources_ipv6: []
host_firewall_expected_tang_consumer_count: 3

# Public application entry points remain separate from management and recovery
# functions. Every service declares one protocol/port and exact source hosts.
host_firewall_public_service_access: {}

# Rootful container publishing traverses DNAT/FORWARD, not host INPUT.
# Reuse the exact public HTTPS source contract; never create a broad forward.
host_firewall_published_https_access:
  enabled: false
  endpoints: []
  host_proxy: false

# Exact container-to-management service paths. Each named capability binds
# source container interfaces and /32 addresses to one management interface,
# exact /32 destinations, protocol, port, and operating modes. The empty
# default keeps all new container forwarding denied.
host_firewall_container_service_access: {}

# Explicit management persists even when the capability map becomes empty, so
# a later transaction can remove old bindings without orphaning its guard.
host_firewall_container_ssh_access: {}
host_firewall_container_ssh_guard_managed: false
host_firewall_container_ssh_guard_table_name: lit_container_ssh_guard

# Deprecated aggregate inputs are retained only to fail closed with an actionable migration error.
host_firewall_controller_source_cidrs: []
host_firewall_recovery_source_cidrs: []
host_firewall_tang_consumer_cidrs: []

host_firewall_control_source_address: ""
host_firewall_control_destination_port: 0

host_firewall_table_family: inet
host_firewall_table_name: lit_host_firewall
host_firewall_input_priority: 10
host_firewall_forward_priority: 10
host_firewall_output_priority: 10

host_firewall_state_directory: /var/lib/lit-host-firewall
host_firewall_transactions_directory: "{{ host_firewall_state_directory }}/transactions"
host_firewall_claims_directory: "{{ host_firewall_state_directory }}/claims"
host_firewall_active_transaction_path: "{{ host_firewall_state_directory }}/active.json"
host_firewall_transaction_lock_path: "{{ host_firewall_state_directory }}/transaction.lock"

# The root file is read-only to this role. Persistence is isolated in one exact include file, and confirmation is
# refused unless an administrator-owned root configuration already contains the exact include directive once.
host_firewall_persistent_root_config_path: /etc/nftables.conf
host_firewall_persistent_include_path: /etc/nftables.d/lit-host-firewall.nft
host_firewall_persistent_include_directive: >-
  include "{{ host_firewall_persistent_include_path }}"

host_firewall_systemd_unit_directory: /etc/systemd/system
host_firewall_transaction_program_path: /usr/local/libexec/lit-host-firewall-transaction
host_firewall_rollback_service_name: lit-host-firewall-rollback.service
host_firewall_rollback_timer_name: lit-host-firewall-rollback.timer
host_firewall_confirmation_service_name: lit-host-firewall-confirm.service
host_firewall_persistence_service_name: nftables.service
host_firewall_watchdog_timeout_seconds: 300
host_firewall_command_timeout_seconds: 15
host_firewall_lock_wait_timeout_seconds: 30

host_firewall_nft_binary: /usr/sbin/nft
host_firewall_systemctl_binary: /usr/bin/systemctl
host_firewall_python_binary: /usr/bin/python3
host_firewall_printenv_binary: /usr/bin/printenv
host_firewall_authorization_verifier_binary: ""
host_firewall_authorization_mode: signed
host_firewall_confirmation: ""

host_firewall_change_id: ""
host_firewall_approved_readback_sha256: ""
host_firewall_authorization_contract: {}
host_firewall_positive_tests_passed: false
host_firewall_negative_tests_passed: false
host_firewall_test_evidence_reference: ""

# The complete egress policy is mandatory when the role is enabled. Keeping the default empty prevents a generic
# collection default from silently authorizing target-specific DNS, NTP, observability, proxy, or Internet flows.
host_firewall_egress_policy: {}
# Optional host-local LIT forward-proxy boundary. In hardened mode this is the
# only rule that may grant public HTTP(S), and it is bound to the proxy service
# socket owner. The role accepts only Ubuntu's reserved non-login `proxy`
# identity at exact UID/GID 13; trusted root must not reuse it for another
# service. Application processes still reach the proxy over loopback.
host_firewall_forward_proxy_egress:
  enabled: false
  status: disabled
  mode: direct
  owner_username: proxy
  interface: ""
  destinations_ipv4: []
  ports: []
  residual: ""

# Container clients may reach the host-local proxy only through explicitly
# named container interfaces and source networks. Loopback needs no rule.
host_firewall_forward_proxy_access:
  enabled: false
  port: 3128
  interfaces: []
  sources_ipv4: []
  destination_ipv4: ""

# Exact per-client container-to-host Squid capabilities. This successor
# contract avoids the interface/source/destination cross product of the legacy
# aggregate above. Each client is one bridge, one /32 source, one observed
# gateway destination, one port, and explicit operating modes. Both contracts
# may not be active together.
host_firewall_forward_proxy_client_access: {}

# Rootful container networks resolve Podman aliases through Aardvark on the
# exact bridge gateway. This input grant is deliberately independent of host
# DNS egress and of proxy access: it permits only TCP/UDP 53 from explicitly
# named container interfaces and RFC1918 source networks to one observed host
# gateway address that is bound to every selected bridge interface by the
# bridge-specific read-only evidence above.
host_firewall_container_dns_access:
  enabled: false
  interfaces: []
  sources_ipv4: []
  destination_ipv4: ""
# Independent UDP-only exact /32 clients, each bound to its own bridge gateway.
# Empty by default; cannot coexist with the legacy aggregate TCP/UDP grant.
host_firewall_container_dns_clients: {}
host_firewall_cis_ipv6_required: "{{ ubtu24cis_ipv6_required | default(false) }}"
host_firewall_provider_ipv6_filter_enabled: false
host_firewall_provider_ipv6_filter_evidence_reference: ""

host_firewall_egress_function_contract:
  dns_udp:
    protocol: udp
    port: 53
    modes: [bootstrap, hardened]
    interface_role: public
  dns_tcp:
    protocol: tcp
    port: 53
    modes: [bootstrap, hardened]
    interface_role: public
  ntp:
    protocol: udp
    port: 123
    modes: [bootstrap, hardened]
    interface_role: public
  atlas_loki:
    protocol: tcp
    port: 3100
    modes: [bootstrap, hardened]
    interface_role: management
  bootstrap_https:
    protocol: tcp
    port: 443
    modes: [bootstrap]
    interface_role: public
  https_proxy:
    protocol: tcp
    port: 3128
    modes: [hardened]
    interface_role: management

host_firewall_ipv4_host_cidr_pattern: >-
  ^(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9][0-9]?|0)(?:\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9][0-9]?|0)){3}/32\Z
# IPv6 inputs are normalized to RFC 5952-style lowercase compressed addresses before policy hashing and rendering.
host_firewall_ipv4_pattern: >-
  ^(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9][0-9]?|0)(?:\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9][0-9]?|0)){3}\Z
host_firewall_ipv6_host_cidr_pattern: '^(?:[0-9a-f:]+)/128\Z'

host_firewall_host_ipv4_addresses_effective:
  - "{{ host_firewall_expected_public_ipv4 }}"
  - "{{ host_firewall_expected_management_ipv4 }}"
host_firewall_host_ipv6_addresses_effective: >-
  {{
    [host_firewall_expected_public_ipv6, host_firewall_expected_management_ipv6]
    | reject('equalto', '')
    | list
  }}
host_firewall_all_management_sources_ipv4: >-
  {{
    host_firewall_management_access.values()
    | map(attribute='sources_ipv4')
    | flatten
    | unique
    | list
  }}
host_firewall_all_management_sources_ipv6: >-
  {{
    host_firewall_management_access.values()
    | map(attribute='sources_ipv6')
    | flatten
    | unique
    | list
  }}
host_firewall_all_public_service_sources_ipv4: >-
  {{
    host_firewall_public_service_access.values()
    | map(attribute='sources_ipv4')
    | flatten
    | unique
    | list
  }}
host_firewall_policy_material:
  schema: lit.host_firewall.policy/v5
  mode: "{{ host_firewall_mode }}"
  target: "{{ host_firewall_expected_inventory_hostname }}"
  public_ipv4: "{{ host_firewall_expected_public_ipv4 }}"
  management_ipv4: "{{ host_firewall_expected_management_ipv4 }}"
  public_ipv6: "{{ host_firewall_expected_public_ipv6 }}"
  management_ipv6: "{{ host_firewall_expected_management_ipv6 }}"
  public_interface: "{{ host_firewall_public_interface }}"
  management_interface: "{{ host_firewall_management_interface }}"
  container_interfaces: "{{ host_firewall_container_interfaces }}"
  management_access: "{{ host_firewall_management_access }}"
  tang_access: "{{ host_firewall_tang_access }}"
  public_service_access: "{{ host_firewall_public_service_access }}"
  container_service_access: "{{ host_firewall_container_service_access }}"
  input_policy: drop
  forward_policy: drop
  output_policy: drop
  ipv4_only: true
  egress_policy: "{{ host_firewall_egress_policy }}"
host_firewall_policy_material_effective: >-
  {{
    host_firewall_policy_material
    | combine(
        {'published_https_access': host_firewall_published_https_access}
        if host_firewall_published_https_access.enabled
        else {}
      )
    | combine(
        {
          'forward_proxy_egress': host_firewall_forward_proxy_egress,
          'forward_proxy_access': host_firewall_forward_proxy_access
        }
        if (
          host_firewall_forward_proxy_egress.enabled | bool
          or host_firewall_forward_proxy_access.enabled | bool
        )
        else {}
      )
    | combine(
        {
          'forward_proxy_client_access': host_firewall_forward_proxy_client_access
        }
        if host_firewall_forward_proxy_client_access | length > 0
        else {}
      )
    | combine(
        {
          'container_dns_access': host_firewall_container_dns_access
        }
        if host_firewall_container_dns_access.enabled | bool
        else {}
      )
    | combine(
        {'container_dns_clients': host_firewall_container_dns_clients}
        if host_firewall_container_dns_clients | length > 0
        else {}
      )
    | combine(
        {
          'schema': 'lit.host_firewall.policy/v6',
          'container_ssh_access': host_firewall_container_ssh_access,
          'container_ssh_bindings': host_firewall_container_ssh_bindings,
          'bridge_guard_table': host_firewall_container_ssh_guard_table_name
        }
        if host_firewall_container_ssh_guard_managed
        else {}
      )
  }}
host_firewall_policy_fingerprint: >-
  {{ host_firewall_policy_material_effective | to_json | hash('sha256') }}
host_firewall_egress_policy_sha256: "{{ host_firewall_egress_policy | to_json | hash('sha256') }}"
host_firewall_egress_status: "{{ host_firewall_egress_policy.get('status', 'draft') }}"
host_firewall_egress_stance: "{{ host_firewall_egress_policy.get('stance', 'unconfigured') }}"

host_firewall_transaction_program_argv:
  - "{{ host_firewall_transaction_program_path }}"
  - --state-directory
  - "{{ host_firewall_state_directory }}"
  - --transactions-directory
  - "{{ host_firewall_transactions_directory }}"
  - --claims-directory
  - "{{ host_firewall_claims_directory }}"
  - --active-path
  - "{{ host_firewall_active_transaction_path }}"
  - --lock-path
  - "{{ host_firewall_transaction_lock_path }}"
  - --persistent-root
  - "{{ host_firewall_persistent_root_config_path }}"
  - --persistent-include
  - "{{ host_firewall_persistent_include_path }}"
  - --program-path
  - "{{ host_firewall_transaction_program_path }}"
  - --systemd-unit-directory
  - "{{ host_firewall_systemd_unit_directory }}"
  - --confirmation-service
  - "{{ host_firewall_confirmation_service_name }}"
  - --rollback-service
  - "{{ host_firewall_rollback_service_name }}"
  - --rollback-timer
  - "{{ host_firewall_rollback_timer_name }}"
  - --persistence-service
  - "{{ host_firewall_persistence_service_name }}"
  - --watchdog-timeout-seconds
  - "{{ host_firewall_watchdog_timeout_seconds }}"
  - --command-timeout-seconds
  - "{{ host_firewall_command_timeout_seconds }}"
  - --lock-wait-timeout-seconds
  - "{{ host_firewall_lock_wait_timeout_seconds }}"
  - --expected-target
  - "{{ host_firewall_expected_inventory_hostname }}"
  - --expected-egress-policy-sha256
  - "{{ host_firewall_egress_policy_sha256 }}"
  - --expected-egress-status
  - "{{ host_firewall_egress_status }}"
  - --table-family
  - "{{ host_firewall_table_family }}"
  - --table-name
  - "{{ host_firewall_table_name }}"
  - --bridge-table-name
  - "{{ host_firewall_container_ssh_guard_table_name if host_firewall_container_ssh_guard_managed else '-' }}"
  - --nft-binary
  - "{{ host_firewall_nft_binary }}"
  - --systemctl-binary
  - "{{ host_firewall_systemctl_binary }}"
  - --verifier-binary
  - >-
    {{
      host_firewall_authorization_verifier_binary
      if host_firewall_authorization_verifier_binary | length > 0
      else '-'
    }}
