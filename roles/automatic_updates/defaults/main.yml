---
automatic_updates_enabled: true
automatic_updates_minute: "0"
automatic_updates_hour: "6"
automatic_updates_weekday: "0"  # Sunday
automatic_updates_user: "root"
automatic_updates_log_file: "/var/log/apt-auto-weekly.log"
automatic_updates_command: "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get -y upgrade"
automatic_updates_cron_name: "Weekly automatic updates"
automatic_updates_initial_update: true
automatic_updates_manage_cron_package: true
automatic_updates_cron_package: cron
automatic_updates_crontab_paths:
  - /usr/bin/crontab
  - /bin/crontab
  - /usr/sbin/crontab
  - /sbin/crontab
# Optional tasks_from=staged_verify; no automatic cache import or update bypass.
automatic_updates_staged_bundle: ""
automatic_updates_staged_request: ""
automatic_updates_staged_action: none
automatic_updates_staged_tool_directory: /usr/local/libexec/lit-staged-apt
automatic_updates_staged_expected_machine_id: ""
automatic_updates_staged_expected_collector_id: ""
automatic_updates_staged_capture_directory: ""
automatic_updates_staged_controller_directory: ""
automatic_updates_staged_capture_sha256: ""
automatic_updates_staged_acquisition_directory: ""
automatic_updates_staged_acquisition_inputs_directory: ""
automatic_updates_staged_delivery_directory: ""
automatic_updates_staged_receive_directory: ""
automatic_updates_staged_expected_archive_sha256: ""
