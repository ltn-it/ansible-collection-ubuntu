---
cis_ubuntu24_profile_tag: ""
cis_ubuntu24_execution_mode: remediate
cis_ubuntu24_audit_log_directory: /var/log/audit
cis_ubuntu24_network_sysctl_file: /etc/sysctl.d/60-lit-cis-network.conf

# Optional inventory-owned mutable data directories. Empty preserves the
# existing upstream integration; an entry requires both path and reason.
cis_ubuntu24_aide_exclusions: []
# A reviewed, one-use input binding for an existing database. Never infer
# approval merely from database age or a requested policy change.
cis_ubuntu24_aide_rebaseline: {}

# Accepted, exact package-compatible usernamespace attachment profiles.
# Nonempty entries require the conflicting upstream L1 rewrite disabled.
cis_ubuntu24_apparmor_preserved_profiles: []

cis_ubuntu24_remediation_dependency:
  repository: https://github.com/ansible-lockdown/UBUNTU24-CIS
  version: "1.6.0"
  commit: c893ca6836fb32b1ea067d4a63c341e39693074b
  license: MIT

cis_ubuntu24_audit_dependency:
  repository: https://github.com/ansible-lockdown/UBUNTU24-CIS-Audit.git
  benchmark: v1.0.0
  commit: 87efcc6d409d1a998a7cb809c5ce5a6afedf84c7
  archive_sha256: 9320558d3bf195625399edfd57e6185cf70cce6d5505fa3c9f9924a369af7850
  license: MIT

# Inventory entries must identify every deliberate control adjustment. The
# wrapper validates their schema; the independent audit reports them as
# exceptions instead of treating an omitted check as a pass.
cis_ubuntu24_exceptions: []
