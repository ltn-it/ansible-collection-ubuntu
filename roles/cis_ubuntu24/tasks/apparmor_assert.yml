---
- name: Validate the AppArmor preservation list type
  ansible.builtin.assert:
    that:
      - cis_ubuntu24_apparmor_preserved_profiles is sequence
      - cis_ubuntu24_apparmor_preserved_profiles is not string
      - cis_ubuntu24_apparmor_preserved_profiles is not mapping

- name: Validate exact approved AppArmor attachment bindings
  ansible.builtin.assert:
    that:
      - item is mapping
      - item.keys() | sort == ['approval_reference', 'executable', 'name', 'reason', 'sha256']
      - item.name is string
      - item.name is match('^[a-z][a-z0-9_-]*$')
      - item.executable is string
      - item.executable is match('^/usr/(sbin|bin)/[a-z][a-z0-9_-]*$')
      - item.sha256 is string
      - item.sha256 is match('^[a-f0-9]{64}$')
      - item.reason is string
      - item.reason | trim | length > 0
      - item.reason | regex_search('[\x00-\x1f\x7f]') is none
      - item.approval_reference is string
      - item.approval_reference | trim | length > 0
      - item.approval_reference | regex_search('[\x00-\x1f\x7f]') is none
    fail_msg: >-
      AppArmor preservation requires exact names, attachments, SHA256 bindings,
      reasons and existing approval references.
  loop: "{{ cis_ubuntu24_apparmor_preserved_profiles }}"
  loop_control:
    label: "{{ item.name | default('<invalid profile>') }}"

- name: Reject duplicate or conflicting AppArmor preservation settings
  when: cis_ubuntu24_apparmor_preserved_profiles | length > 0
  ansible.builtin.assert:
    that:
      - >-
        cis_ubuntu24_apparmor_preserved_profiles | map(attribute='name') | unique | length
        == cis_ubuntu24_apparmor_preserved_profiles | length
      - cis_ubuntu24_profile_tag is match('^level1-')
      - ubtu24cis_rule_1_3_1_3 | default(true) is sameas false
    fail_msg: >-
      Preserved AppArmor attachments require an explicit Level 1 exception
      with upstream 1.3.1.3 disabled. The reference records existing approval;
      declaring a value does not grant approval or authorize a Level 2 waiver.

- name: Require a visible accepted AppArmor control exception
  when: cis_ubuntu24_apparmor_preserved_profiles | length > 0
  ansible.builtin.assert:
    that:
      - cis_ubuntu24_apparmor_control_exceptions | length == 1
      - cis_ubuntu24_apparmor_control_exceptions[0].audit_visibility | default('') == 'intentional_exception'
      - cis_ubuntu24_apparmor_control_exceptions[0].approval_state | default('') == 'accepted'
      - >-
        cis_ubuntu24_apparmor_preserved_profiles | map(attribute='approval_reference') | unique | list
        == [cis_ubuntu24_apparmor_control_exceptions[0].approval_reference | default('')]
    fail_msg: The exact accepted AppArmor exception and approval binding must remain visible to the independent audit.
  vars:
    cis_ubuntu24_apparmor_control_exceptions: >-
      {{ cis_ubuntu24_exceptions | selectattr('control_ids', 'contains', '1.3.1.3') | list }}
