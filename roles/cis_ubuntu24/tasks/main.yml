---
- name: Validate Ubuntu 24 CIS inputs
  ansible.builtin.import_tasks: assert.yml
  tags: always

- name: Verify the accepted AppArmor attachment boundary before remediation
  ansible.builtin.import_tasks: apparmor_guard.yml
  when: cis_ubuntu24_apparmor_preserved_profiles | length > 0
  tags:
    - level1-server
    - level1-workstation
    - setup_audit

- name: Block explicitly unused filesystem modules without unloading them
  ansible.builtin.import_tasks: filesystem_modules.yml
  when:
    - cis_ubuntu24_execution_mode == 'remediate'
    - cis_ubuntu24_disabled_filesystem_modules | length > 0
  tags:
    - level1-server
    - level1-workstation
    - level2-server
    - level2-workstation

- name: Detect an already managed AIDE policy even when requested exclusions are empty
  ansible.builtin.stat:
    path: /etc/aide/aide.conf.d/90_lit_mutable_data
    follow: false
    get_checksum: false
  register: cis_ubuntu24_aide_owned_policy
  when: cis_ubuntu24_execution_mode == 'remediate'
  tags:
    - level1-server
    - level1-workstation
    - level2-server
    - level2-workstation

- name: Prepare guarded AIDE exclusions before upstream initialization
  ansible.builtin.import_tasks: aide_prepare.yml
  when:
    - cis_ubuntu24_execution_mode == 'remediate'
    - cis_ubuntu24_aide_exclusions | length > 0 or cis_ubuntu24_aide_owned_policy.stat.exists | default(false)
  tags:
    - level1-server
    - level1-workstation
    - level2-server
    - level2-workstation

- name: Normalize the upstream AIDE scheduler integration
  ansible.builtin.import_tasks: aide_scheduler.yml
  tags:
    - level1-server
    - level1-workstation
    - level2-server
    - level2-workstation

- name: Preserve a traversable upstream audit log directory
  ansible.builtin.import_tasks: audit_log_directory.yml
  tags:
    - level1-server
    - level1-workstation
    - level2-server
    - level2-workstation

- name: Persist the network kernel controls audited independently
  ansible.builtin.import_tasks: network_sysctl_persistence.yml
  tags:
    - level1-server
    - level1-workstation
    - level2-server
    - level2-workstation

- name: Prepare the independently pinned auditor on the controller
  ansible.builtin.import_tasks: auditor.yml
  when: cis_ubuntu24_execution_mode == 'audit'
  tags: always

- name: Admit the independently bound offline audit archive before upstream execution
  ansible.builtin.import_tasks: audit_archive.yml
  when:
    - cis_ubuntu24_execution_mode == 'audit'
    - audit_content | default('git') == 'archive'
  tags: always

- name: Keep generated audit variables outside the reviewed checkout
  ansible.builtin.import_tasks: audit_variables.yml
  when: cis_ubuntu24_execution_mode == 'audit'
  tags: always

- name: Preserve root ownership across upstream audit extraction
  module_defaults:
    ansible.builtin.unarchive:
      owner: root
      group: root
  block:
    - name: Apply ansible-lockdown Ubuntu 24 CIS role
      # Keep the import untagged to retain native upstream profile filtering.
      ansible.builtin.import_role:
        name: ansible-lockdown.ubuntu24_cis  # noqa syntax-check[specific] -- EE-installed dependency
      vars:
        audit_file_git: "{{ cis_ubuntu24_audit_dependency.repository }}"  # noqa: var-naming[no-role-prefix]
        audit_git_version: "{{ cis_ubuntu24_audit_dependency.commit }}"  # noqa: var-naming[no-role-prefix]

- name: Verify effective unused filesystem protection after upstream execution
  ansible.builtin.import_tasks: filesystem_modules_verify.yml
  when:
    - cis_ubuntu24_execution_mode == 'remediate'
    - cis_ubuntu24_disabled_filesystem_modules | length > 0
  tags:
    - level1-server
    - level1-workstation
    - level2-server
    - level2-workstation

- name: Verify the accepted AppArmor attachment boundary after upstream execution
  # Upstream audit_only ends this host. Audit callers must run this existing
  # task entrypoint in a subsequent play before accepting their evidence.
  ansible.builtin.import_tasks: apparmor_guard.yml
  when: cis_ubuntu24_apparmor_preserved_profiles | length > 0
  tags:
    - level1-server
    - level1-workstation
    - setup_audit
