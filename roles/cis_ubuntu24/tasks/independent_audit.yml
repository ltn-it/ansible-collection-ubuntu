---
- name: Require a real independent audit and protected absolute evidence paths
  ansible.builtin.assert:
    that:
      - not ansible_check_mode
      - audit_conf_dest is string and audit_conf_dest is match('^/')
      - audit_log_dir is string and audit_log_dir is match('^/')
      - audit_output_destination is string and audit_output_destination is match('^/')
      - audit_output_collection_method == 'fetch'
      - ansible_facts.virtualization_type | default('') not in ['docker', 'lxc', 'openvz', 'podman', 'container']
    fail_msg: Independent CIS audit requires a native target and fresh protected evidence directories.

- name: Install the checksum-pinned upstream Goss binary without remediation
  ansible.builtin.include_role:
    name: ansible-lockdown.ubuntu24_cis
    tasks_from: LE_audit_setup.yml
    vars_from: audit.yml
    public: true
    apply:
      tags: setup_audit

- name: Verify the exact independent audit commit
  ansible.builtin.command:
    argv: [git, '-C', "{{ audit_conf_dest }}/UBUNTU24-CIS-Audit", rev-parse, '--verify', 'HEAD^{commit}']
  register: cis_ubuntu24_independent_audit_commit
  changed_when: false
  failed_when: >-
    cis_ubuntu24_independent_audit_commit.rc != 0 or
    cis_ubuntu24_independent_audit_commit.stdout | trim != cis_ubuntu24_audit_dependency.commit

- name: Require an unmodified independent audit checkout
  ansible.builtin.command:
    argv: [git, '-C', "{{ audit_conf_dest }}/UBUNTU24-CIS-Audit", status, '--porcelain=v1', '--untracked-files=all']
  register: cis_ubuntu24_independent_audit_status
  changed_when: false
  failed_when: >-
    cis_ubuntu24_independent_audit_status.rc != 0 or
    cis_ubuntu24_independent_audit_status.stdout | trim | length != 0

- name: Read the pinned audit schema defaults
  ansible.builtin.slurp:
    src: "{{ audit_conf_dest }}/UBUNTU24-CIS-Audit/vars/CIS.yml"
  register: cis_ubuntu24_independent_audit_schema
  no_log: true

- name: Bind the pinned audit schema to the complete effective policy
  ansible.builtin.set_fact:
    cis_ubuntu24_independent_audit_vars: >-
      {{
        (cis_ubuntu24_independent_audit_schema.content | b64decode | from_yaml)
        | combine(vars | dict2items | selectattr('key', 'match', '^ubtu24cis_') | items2dict)
        | combine({
          'benchmark_version': benchmark_version,
          'timeout_ms': audit_cmd_timeout,
          'run_heavy_tests': audit_run_heavy_tests,
          'ubtu24_legacy_boot': (
            ansible_facts.mounts | selectattr('mount', 'equalto', '/boot/efi') | list | length == 0
          ),
          'ubtu24cis_auditd_back_log_limit': ubtu24cis_audit_back_log_limit,
          'ubtu24cis_varlog_location': ubtu24cis_sudo_logfile
        })
      }}
  no_log: true

- name: Protect independent audit output and input directories
  ansible.builtin.file:
    path: "{{ audit_log_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Write effective audit variables outside the immutable checkout
  ansible.builtin.copy:
    content: "{{ cis_ubuntu24_independent_audit_vars | to_nice_yaml }}"
    dest: "{{ audit_log_dir }}/effective-vars.yml"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Execute the pinned independent audit with the complete policy
  ansible.builtin.command:
    argv:
      - "{{ audit_conf_dest }}/UBUNTU24-CIS-Audit/run_audit.sh"
      - '-v'
      - "{{ audit_log_dir }}/effective-vars.yml"
      - '-f'
      - json
      - '-m'
      - "{{ audit_max_concurrent | string }}"
      - '-o'
      - "{{ pre_audit_outfile }}"
      - '-g'
      - "{{ group_names | to_json }}"
  environment:
    AUDIT_BIN: "{{ audit_bin }}"
    AUDIT_CONTENT_LOCATION: "{{ audit_conf_dest }}"
    AUDIT_FILE: goss.yml
  changed_when: true

- name: Protect fresh independent audit output
  ansible.builtin.file:
    path: "{{ pre_audit_outfile }}"
    owner: root
    group: root
    mode: "0600"

- name: Read protected fresh independent audit output
  ansible.builtin.slurp:
    src: "{{ pre_audit_outfile }}"
  register: cis_ubuntu24_independent_audit_raw
  no_log: true

- name: Create the protected controller audit destination
  ansible.builtin.file:
    path: "{{ audit_output_destination }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Retain protected raw audit evidence without privileged fetch assumptions
  ansible.builtin.copy:
    content: "{{ cis_ubuntu24_independent_audit_raw.content | b64decode }}"
    dest: "{{ audit_output_destination }}/{{ pre_audit_outfile | basename }}"
    mode: "0600"
  delegate_to: localhost
  become: false
  no_log: true
