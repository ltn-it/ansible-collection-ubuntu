---
- name: Read complete native password policy without shadow data export
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - '-'
      - "{{ ubtu24cis_pass_max_days | string }}"
      - "{{ ubtu24cis_pass_warn_age | string }}"
    stdin: "{{ lookup('ansible.builtin.file', role_path ~ '/files/password_policy_audit.py') }}"
  register: cis_ubuntu24_password_policy_raw
  changed_when: false
  failed_when: cis_ubuntu24_password_policy_raw.rc not in [0, 1]
  check_mode: false

- name: Retain complete scoped password policy audit evidence
  ansible.builtin.set_fact:
    cis_ubuntu24_password_policy_evidence: "{{ cis_ubuntu24_password_policy_raw.stdout | from_json }}"
