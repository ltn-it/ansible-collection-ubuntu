    changes:
      bugfixes:
        - Accept the native zero-second timer floor when verifying the exact recorded
          Incus host fence during continuation.
        - Allow the Incus runner to read the container ID written by Podman 4.9 under
          a private lease directory and retain the existing ownership checks.
        - Allow the Incus watchdog and admission checks to read the same lease ledger
          concurrently while preserving exclusive locks for state changes.
        - Bind the G06 continuation after verified cleanup to the published Validation
          admission workflow and its matching collection workflow digest. Preserve
          the original failed run's reusable revision and retirement checks.
        - Bind the Incus test controller's systemd slice to the original lease before
          engine startup and remove it after verified cleanup.
        - Bind the next isolated Incus run to the archived failed start, the ordered
          retirement journals and the exact successor workflow. Verify that the old
          lease resources remain absent without rewriting the original start outcome.
        - Give final observers a separate bounded read wait for cleanup receipts while
          retaining the existing Root proof and frame deadlines.
        - Give protected Incus business tests a bounded private shared-memory mount
          so Ansible can start multiprocessing with a read-only container root. Preserve
          the original byte representation of retained execution manifests.
        - Incus cleanup history - collect only authenticated closed observation bytes
          after durable closure, retaining their Ledger bindings and audit records.
          Historical collection stays bounded per call, so retained history can be
          drained safely before the next cleanup without raising existing limits.
          Prove the complete collection scope and metadata inventory before mutation;
          lease-specific collection preserves other leases' staged files and records.
        - Incus cleanup metadata - recover ownership-checked observation files left
          by a crash before their Ledger reference was published, under the exclusive
          Ledger lock and within bounded work; preserve every durable reference and
          retain the original effect outcome without replaying resource deletion.
        - Incus cleanup publication - finish metadata preparation before atomically
          recording the one-shot cleanup intent and its guard. Recover incomplete
          metadata writes only through durable exact-name reservations; retain HOLD
          for ambiguous publication or any possible resource mutation without replay.
        - Incus cleanup receipt safety - preserve pending postchecks durably before
          deletion; validate quota exit and receipt completion inside the original
          deadline, then permit closure only with the same-process completion witness.
          A reopened Ledger holds until a fresh exclusive Root-session readback reauthenticates
          the original owner, custody, quota, full native scope and exact resource/consumer
          absence; no deletion or authority clock is repeated. Hash-bound inode-only
          metadata remains private audit evidence through durable closure and permits
          only exact-owned post-close metadata collection.
        - Keep local-mail initialization check mode read-only without asserting unrendered
          Postfix transport settings or creating an ownership receipt.
        - Make the GitHub runner's Incus test environment compatible with Podman 4.9
          by using a writable sticky directory for cell home and temporary files.
        - Preserve the active successor identity when checking the retired C28 network
          fence.
        - Preserve the failed Runner01 intake and configuration as read-only evidence
          when qualifying its next protected Main push.
        - Preserve the original Incus preparation record and verify its cleanup before
          admitting the next protected push.
        - Record allowlisted firewall failure categories in the private runtime journal.
        - Refuse managed AIDE policy changes in Level 2-only runs before mutation
          and align the scheduler wrapper with the pinned native Level 1 initialization
          and scheduling tags.
        - Refuse whitespace, shell metacharacters and relative components in vendor
          audit execution paths before Git or archive transport activity.
        - Reuse the worker acquisition across the derived Incus lookup and bound the
          pre-challenge wait separately from authentication and lease deadlines.
        - Separate archive staging and private job configuration into individually
          authenticated requests so Runner01 can complete both within their existing
          GitHub authorization windows.
        - Start Incus runner job containers in their assigned network namespace without
          applying Podman 4.9's default ping group sysctl to that namespace.
        - Start renewal earlier for derived Incus configurations to account for retained
          history verification.
        - Support an explicit disabled installation handoff for an expired, verified
          pre-engine preparation so the updated finalizer can recover it.
        - Use Git's own read-only configuration parser, reject redirected Git metadata
          and run admission probes with a fresh environment so legacy filter syntax
          or inherited Git settings cannot bypass validation.
        - Validate complete checkout and Git metadata before root Git probes, disable
          executable Git features and reject conflicting effective auditor bindings.
        - Verify that no task or socket still references the retired C28 network namespace.
        - Wait briefly for concurrent ledger readers when committing Incus firewall
          creation evidence. Kernel operations are issued once.
        - Wait for Podman to finish writing its private container ID file during the
          existing bounded Incus runner startup. Record fixed startup failure codes
          in the local runtime diagnostics. Keep Podman storage inside the existing
          private quota mount without an additional bind on the overlay directory.
          Expose only the cell's own storage paths to Podman's mount namespace and
          restore host-side directory modes after tracking the container.
