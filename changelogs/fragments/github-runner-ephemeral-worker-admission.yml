---
minor_changes:
  - >-
    github_runner - add a read-only native queued-job admission building block
    for the external disposable VM controller; allocation and operating acceptance
    remain separate.
  - >-
    github_runner - add a root-private single-worker fence that retains allocation
    intents after controller exit and refuses implicit capacity reuse.
  - >-
    github_runner - derive stopped create-only allocation inputs from the durable
    worker intent and bind the first observed native VM UUID without releasing
    capacity or adopting replacement instances.
  - >-
    github_runner - add a root-local GET-only Incus inventory adapter with Unix
    peer and endpoint checks, pinned profile/image readback and narrowed VM
    observations; native mutation and cleanup remain separate.
  - >-
    github_runner - add schema3 one-shot create-only provider dispatch with durable
    pre-effect intent and synchronous completion readback; interrupted or unknown
    effects retain capacity, and older state is never silently migrated.
  - >-
    github_runner - add a root-local Incus create provider that submits one stopped
    VM through the durable dispatch fence and reads back the exact native operation
    without retrying unknown outcomes.
  - >-
    github_runner - add a UUID-bound one-shot local Incus start provider with
    durable dispatch, exact operation completion, deadline checks and read-only
    recovery after proven completion; unknown starts retain capacity.
  - >-
    github_runner - add a UUID-bound graceful stop provider and native PID/state
    quiescence reconciliation; unknown or failed stops never retry, force-stop,
    delete resources or release global capacity.
  - >-
    github_runner - add a one-shot stopped-UUID removal component gated by trusted
    retention/evidence authorization and native operation/absence readback;
    uncertain deletion never replays or releases capacity.
  - >-
    github_runner - add a Root-private terminal-job retention gate with four-hour
    failed-cell retention, exact custodian-approved extensions bounded to 24 hours,
    private-evidence verification and UUID/ticket binding before deletion.
  - >-
    github_runner - add a Root-only expiry watchdog tick and independently locked
    durable pending-alarm spool; unknown outcomes reconcile read-only without
    replay or release, and local spooling never implies external alarm delivery.
  - >-
    github_runner - add separately opt-in pinned Root watchdog preparation and
    systemd timer activation with target/boot identity, private-path and existing
    asset guards; default runner behavior remains unchanged.
bugfixes:
  - >-
    github_runner - charge slow native qualification and durable-intent writes
    against the allocation window and recheck immediately before the local Incus
    create request, preventing late VM creation after admission expiry.
  - >-
    github_runner - explicitly disable disposable VM autostart and require native
    readback of the value so a host restart cannot silently resume a worker.
