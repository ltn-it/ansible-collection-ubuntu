---
bugfixes:
  - >-
    github_runner - Keep physical test destruction pending until Root verifies the original native job,
    captured evidence, provider upload contents and owned cleanup; retain failed cells with revoked access
    for the configured custody period.
  - >-
    github_runner - Prepare repeatable authenticated Main-job intake, closed operating drills, independent
    custody watchdog and verified local-root mail through the disabled runtime-v2 installation path.
  - >-
    github_runner - Bind deny-first host-fence maintenance to the sealed dynamic bootstrap before the
    first native job, without creating a static registry or weakening runtime grant ownership.
  - >-
    github_runner - Persist owned cleanup once per emptied directory and reuse the native filesystem-stat
    symbol while preserving every actual descriptor, mount, identity and deadline check.
  - >-
    github_runner - Finalize retained operating cells from verified diagnostics without business-quality
    acceptance, retire closed bindings through bounded fair supervision, and reject mismatched watchdog directories.
  - >-
    github_runner - Isolate interrupted mail replacements and archive confirmed events durably without replay,
    so historical delivery records cannot exhaust pending notification capacity; keep mail fixtures private.
  - >-
    github_runner - Preserve validated ordinary diagnostic delivery across typed finalization holds while
    retaining the exact original owner and denying trust, archive and partial-stream failures.
