---
bugfixes:
  - >-
      github_runner - activate the deny-all private namespace links before adding the Incus backend route.
  - >-
      github_runner - inspect independent empty thread descriptor tables during namespace drain while retaining
      reference and ownership checks.
  - >-
      github_runner - retain typed nsfs namespace mount roots in cleanup inventories while rejecting their use
      as ordinary filesystem roots.
  - >-
      github_runner - bind cleanup process identity to start ticks across ordinary live scheduling transitions
      and reacquire complete network reference scans after transient churn within the original time budget.
  - >-
      github_runner - preserve the separately retired original partial preparation and all prior native
      histories when qualifying an exact subsequent Main transition; unknown effects remain unknown.
  - >-
      github_runner - permit only an explicitly sealed, separately retired original partial-preparation bank
      during a code-only installation while retaining generic all-closed checks and the original unknown
      outcome.
  - >-
      github_runner - reacquire complete storage-consumer observations after bounded task or process churn under
      the original deadline; retain global inventory limits and immediate denial for real references or
      visibility failures.
  - >-
      github_runner - join independent GitHub readback requests and all four complete process-view checks,
      preserving both observation rounds, joined failures, host-file equality and aggregate byte limits.
  - >-
      github_runner - distinguish a changed borrowed socket descriptor from a stable forbidden namespace socket;
      only descriptor churn may trigger complete reacquisition within the existing deadline.
  - >-
      github_runner - read runtime receipt cell configuration through the existing sealed cell contract,
      retaining its size and digest guards for source inventories larger than 64 KiB.
  - >-
      github_runner - serialize full runner-tree walks within each acquisition round
      while checking all four process roots.
  - >-
      github_runner - pin the complete retirement qualification and the independently checked storage volume,
      inspect every task's mount view during retirement, and retry a full socket scan if a local descriptor closes.
  - >-
      github_runner - start the longest historical lookup in the first batch and reduce repeated
      path and mapping work during full process scans within the existing authorization deadline.
  - >-
      github_runner - interrupt executable verification at the initial VM preparation deadline, check each task's
      mount view during ordinary cleanup, and verify the retired host interface and namespace alias before and
      after checking the original resources.
