bugfixes:
  - >-
    github_runner - Traverse Root-owned search-only socket directories using Linux O_PATH handles in both public
    Incus clients, preserving directory ownership, mode and symlink checks without adding directory-read permission.
  - >-
    github_runner - Accept one Root-qualified replacement Main run after the recorded original client precheck
    failure, preserving attempt-one identities and original failure evidence, and reject unknown, reused or
    partially consumed invocations. Optional continuation controls bind the exact replacement run and controller
    until the operator completes the pilot and removes that temporary fence.
