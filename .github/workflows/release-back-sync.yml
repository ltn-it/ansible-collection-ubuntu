# yamllint disable rule:truthy
---
name: Back-sync collection release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to back-sync, for example v1.2.3.
        required: true

permissions:
  contents: read

# Serialize attempts for the same release while preserving an active producer.
# A successor may finish creating a missing PR, but never redispatches review
# for an already-open PR.
concurrency:
  group: >-
    release-back-sync-${{ github.repository }}-${{ startsWith(github.event.release.tag_name || inputs.tag, 'v') && (github.event.release.tag_name || inputs.tag) || format('v{0}', github.event.release.tag_name || inputs.tag) }}
  cancel-in-progress: false

jobs:
  back-sync:
    timeout-minutes: 10
    name: Open release back-sync PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Mint release automation App token
        id: release-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Resolve release automation App bot identity
        id: release-bot
        env:
          APP_SLUG: ${{ steps.release-app.outputs.app-slug }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bot_json="$(gh api "users/${APP_SLUG}%5Bbot%5D" 2>/dev/null || printf '{}')"
          login="$(jq -r '.login // ""' <<<"$bot_json")"
          bot_id="$(jq -r '.id // ""' <<<"$bot_json")"
          if [ "$login" != "${APP_SLUG}[bot]" ] || ! [[ "$bot_id" =~ ^[0-9]+$ ]]; then
            echo "::error::Unable to resolve the release automation App bot identity."
            exit 1
          fi
          echo "login=$login" >>"$GITHUB_OUTPUT"
          echo "email=${bot_id}+${login}@users.noreply.github.com" >>"$GITHUB_OUTPUT"

      - name: Open or update release back-sync PR
        id: exact-review-target
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          TAG_INPUT: ${{ github.event.inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          bot_login="$(gh api "users/lightning-it-release-automation%5Bbot%5D" --jq .login)"
          if [ "$bot_login" != "lightning-it-release-automation[bot]" ]; then
            echo "::error::Release App identity mismatch: expected lightning-it-release-automation[bot]."
            exit 1
          fi
          gh auth setup-git

          tag="${RELEASE_TAG:-${TAG_INPUT:-}}"
          if [ -z "$tag" ]; then
            echo "::error::Release tag is required."
            exit 1
          fi
          case "$tag" in
            v*) ;;
            *) tag="v${tag}" ;;
          esac

          if ! git ls-remote --exit-code --heads origin develop >/dev/null 2>&1; then
            echo "develop branch does not exist; skipping release back-sync."
            exit 0
          fi

          git config user.name "lightning-it-release-automation[bot]"
          git config user.email "307565056+lightning-it-release-automation[bot]@users.noreply.github.com"
          git fetch origin main develop

          if git merge-base --is-ancestor origin/main origin/develop; then
            echo "develop already contains main; release back-sync not needed."
            exit 0
          fi

          branch="backsync/release-${tag}-to-develop"
          title="chore: sync ${tag} release back to develop"
          body=$'Release back-sync from `main` to `develop`.\n\n'
          body+=$'This PR brings release-generated files, changelog metadata, '
          body+=$'and `galaxy.yml` version changes back to `develop` after '
          body+="\`${tag}\` was published.\n\n"
          body+=$'Merge this PR with a merge commit, not squash or rebase, '
          body+=$'so `main` becomes an ancestor of `develop`.'

          git switch -C "$branch" origin/develop
          git merge --no-ff -X ours origin/main \
            -m "chore: sync ${tag} release back to develop"

          release_paths=(
            CHANGELOG.rst
            changelogs/.plugin-cache.yaml
            changelogs/changelog.yaml
            galaxy.yml
          )
          for path in "${release_paths[@]}"; do
            if git cat-file -e "origin/main:${path}" 2>/dev/null; then
              git checkout origin/main -- "$path"
            else
              rm -f "$path"
            fi
          done

          release_base=""
          if release_base="$(git rev-parse origin/main^1 2>/dev/null)"; then
            git diff --name-only --diff-filter=D \
              "$release_base" origin/main -- changelogs/fragments/ \
              | xargs -r rm -f
          fi

          git add -A CHANGELOG.rst changelogs galaxy.yml
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi

          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/develop)" ]; then
            echo "::error::Release back-sync did not create an ancestry commit."
            exit 1
          fi
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::Release back-sync head does not contain current main ancestry."
            exit 1
          fi

          gh auth setup-git
          local_head="$(git rev-parse HEAD)"
          remote_head_before="$(git ls-remote --heads origin "refs/heads/${branch}" | awk 'NR == 1 { print $1 }')"
          if [ -n "$remote_head_before" ]; then
            [[ "$remote_head_before" =~ ^[0-9a-f]{40}$ ]]
            git fetch --no-tags origin "refs/heads/${branch}"
            if [ "$(git rev-parse FETCH_HEAD)" != "$remote_head_before" ]; then
              echo "::error::Release back-sync branch changed during validation."
              exit 1
            fi
            # Regenerating a merge changes its timestamp. Reuse only the
            # published commit with the same exact parents and tree; a changed
            # revision must use the protected fresh-revision/PR path.
            if [ "$(git rev-parse "${remote_head_before}^{tree}")" != \
                 "$(git rev-parse "${local_head}^{tree}")" ] || \
               [ "$(git show -s --format=%P "$remote_head_before")" != \
                 "$(git show -s --format=%P "$local_head")" ]; then
              echo "::error::Existing back-sync branch has a different revision."
              exit 1
            fi
            git reset --hard "$remote_head_before"
            local_head="$remote_head_before"
          fi
          if ! git push \
              --force-with-lease="refs/heads/${branch}:${remote_head_before}" \
              origin "$branch"
          then
            echo "::error::Release back-sync branch changed after the exact lease was captured."
            exit 1
          fi
          remote_head_after="$(
            git ls-remote --heads origin "refs/heads/${branch}" \
              | awk 'NR == 1 { print $1 }'
          )"
          if [ "$remote_head_after" != "$local_head" ]; then
            echo "::error::Release back-sync did not publish the exact local head."
            exit 1
          fi
          if ! gh label list --repo "$REPO" --json name --jq '.[].name' \
            | grep -Fxq skip-changelog
          then
            label_error="$(mktemp)"
            if ! gh label create skip-changelog \
                --repo "$REPO" \
                --description "Changelog fragment intentionally not required for this PR." \
                --color "6f42c1" 2>"$label_error"
            then
              if ! gh label list --repo "$REPO" --json name --jq '.[].name' \
                | grep -Fxq skip-changelog
              then
                cat "$label_error" >&2
                exit 1
              fi
            fi
          fi

          expected_base="$(
            git ls-remote --heads origin refs/heads/develop \
              | awk 'NR == 1 { print $1 }'
          )"
          expected_head="$(git rev-parse HEAD)"
          [[ "$expected_base" =~ ^[0-9a-f]{40}$ ]]
          [[ "$expected_head" =~ ^[0-9a-f]{40}$ ]]
          validate_existing_back_sync_pr() {
            local candidate="$1"
            local candidate_json
            candidate_json="$(gh pr view "$candidate" \
              --repo "$REPO" \
              --json author,baseRefName,baseRefOid,headRefName,headRefOid,headRepository,isDraft)"
            jq -e \
              --arg branch "$branch" \
              --arg expected_base "$expected_base" \
              --arg expected_head "$expected_head" \
              --arg repo "$REPO" '
                .author.login == "app/lightning-it-release-automation"
                and .baseRefName == "develop"
                and .baseRefOid == $expected_base
                and .headRefName == $branch
                and .headRefOid == $expected_head
                and .headRepository.nameWithOwner == $repo
                and .isDraft == false
              ' <<< "$candidate_json" >/dev/null
          }

          head_query="$(jq -rn --arg value "${GITHUB_REPOSITORY_OWNER}:${branch}" '$value | @uri')"
          prior="$(gh api --paginate --slurp \
            "repos/${REPO}/pulls?state=all&head=${head_query}&base=develop&per_page=100")"
          jq -e \
            --arg branch "$branch" \
            --arg repo "$REPO" '
              type == "array" and length > 0 and
              all(.[]; type == "array") and
              all(.[][];
                (.number | type) == "number" and .number > 0 and
                (.number | floor) == .number and
                (.state == "open" or .state == "closed") and
                .base.ref == "develop" and .head.ref == $branch and
                .head.repo.full_name == $repo and
                (.head.sha | type) == "string" and
                (.base.sha | type) == "string" and
                (.user.login | type) == "string" and
                (.html_url | type) == "string")
            ' <<< "$prior" >/dev/null || {
              echo "::error::Release back-sync PR history is incomplete."
              exit 1
            }
          matching="$(jq -c '[.[][]] | unique_by(.number)' <<< "$prior")"
          if [ "$(jq 'length' <<< "$matching")" != \
               "$(jq '[.[][]] | length' <<< "$prior")" ]; then
            echo "::error::Release back-sync PR history has duplicate entries."
            exit 1
          fi
          if [ "$(jq '[.[] | select(.state == "closed")] | length' <<< "$matching")" -ne 0 ]; then
            echo "::error::A closed back-sync PR already used this branch."
            exit 1
          fi
          if [ "$(jq 'length' <<< "$matching")" -gt 1 ]; then
            echo "::error::Ambiguous open release back-sync PR history."
            exit 1
          fi
          existing="$(jq -r '.[0].html_url // empty' <<< "$matching")"
          created_pr=false
          if [ -n "$existing" ]; then
            validate_existing_back_sync_pr "$existing"
          else
            existing="$(gh pr create \
              --repo "$REPO" \
              --base develop \
              --head "$branch" \
              --title "$title" \
              --body "$body" \
              --label skip-changelog)" || {
                echo "::error::Failed to create release back-sync PR."
                exit 1
              }
            created_pr=true
          fi
          back_sync_pr="$(gh pr view "$existing" \
            --repo "$REPO" \
            --json author,baseRefName,baseRefOid,headRefName,headRefOid,headRepository,isDraft,number,title)"
          jq -e \
            --arg branch "$branch" \
            --arg expected_base "$expected_base" \
            --arg expected_head "$expected_head" \
            --arg repo "$REPO" \
            --arg title "$title" '
              .author.login == "app/lightning-it-release-automation"
              and .baseRefName == "develop"
              and .baseRefOid == $expected_base
              and .headRefName == $branch
              and .headRefOid == $expected_head
              and .headRepository.nameWithOwner == $repo
              and .isDraft == false
              and .title == $title
            ' <<< "$back_sync_pr" >/dev/null
          {
            echo "pr_number=$(jq -r .number <<<"$back_sync_pr")"
            echo "base_ref=$(jq -r .baseRefName <<<"$back_sync_pr")"
            echo "expected_base=$(jq -r .baseRefOid <<<"$back_sync_pr")"
            echo "expected_head=$(jq -r .headRefOid <<<"$back_sync_pr")"
            if [ "$created_pr" = true ]; then
              echo "dispatch_review=true"
            else
              echo "dispatch_review=false"
            fi
          } >>"$GITHUB_OUTPUT"

      - name: Mint protected review dispatch token
        if: >-
          steps.exact-review-target.outputs.pr_number != '' &&
          steps.exact-review-target.outputs.dispatch_review == 'true'
        id: review-dispatch-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: write
          permission-contents: read

      - name: Dispatch protected Exact-Revision review
        if: >-
          steps.exact-review-target.outputs.pr_number != '' &&
          steps.exact-review-target.outputs.dispatch_review == 'true'
        env:
          GH_TOKEN: ${{ steps.review-dispatch-app.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.exact-review-target.outputs.pr_number }}
          BASE_REF: ${{ steps.exact-review-target.outputs.base_ref }}
          EXPECTED_BASE: ${{ steps.exact-review-target.outputs.expected_base }}
          EXPECTED_HEAD: ${{ steps.exact-review-target.outputs.expected_head }}
        run: |
          set -euo pipefail
          [[ "${EXPECTED_BASE}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${EXPECTED_HEAD}" =~ ^[0-9a-f]{40}$ ]]
          gh workflow run release-bot-exact-head-review.yml \
            --repo "${REPO}" \
            --ref "${BASE_REF}" \
            -f "pr_number=${PR_NUMBER}" \
            -f "base_ref=${BASE_REF}" \
            -f "expected_base=${EXPECTED_BASE}" \
            -f "expected_head=${EXPECTED_HEAD}"
