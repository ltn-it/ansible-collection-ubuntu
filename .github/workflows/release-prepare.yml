# yamllint disable rule:truthy
---
name: Prepare collection release

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Release version, for example 1.2.3. Leave empty on manual runs to calculate the next feature version.
        required: false
        default: ""
      base_branch:
        description: Base branch. Leave empty to prefer develop, then main.
        required: false
        default: ""
      target_branch:
        description: Release PR target branch. Must be main.
        required: false
        default: main
      create_github_release:
        description: Create a GitHub release after merge.
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      publish_galaxy:
        description: Publish to Ansible Galaxy after merge.
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare release PR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      github.ref_protected == true &&
      (
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/develop'
      ) &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'push' &&
          !startsWith(github.event.head_commit.message, 'chore(release): prepare v')
        )
      )
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.14"

      - name: Install release tools
        run: >-
          python -m pip install --disable-pip-version-check --no-input
          ansible-core==2.18.13 antsibull-changelog==0.35.1 PyYAML==6.0.3

      - name: Mint release automation App token
        id: release-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Resolve release automation App bot identity
        id: release-bot
        env:
          APP_SLUG: ${{ steps.release-app.outputs.app-slug }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bot_json="$(gh api "users/${APP_SLUG}%5Bbot%5D" 2>/dev/null || printf '{}')"
          login="$(jq -r '.login // ""' <<<"$bot_json")"
          bot_id="$(jq -r '.id // ""' <<<"$bot_json")"
          if [ "$login" != "${APP_SLUG}[bot]" ] || ! [[ "$bot_id" =~ ^[0-9]+$ ]]; then
            echo "::error::Unable to resolve the release automation App bot identity."
            exit 1
          fi
          echo "login=$login" >>"$GITHUB_OUTPUT"
          echo "email=${bot_id}+${login}@users.noreply.github.com" >>"$GITHUB_OUTPUT"

      - name: Prepare release branch
        id: exact-review-target
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          VERSION_INPUT: ${{ github.event.inputs.version }}
          BASE_BRANCH_INPUT: ${{ github.event.inputs.base_branch }}
          TARGET_BRANCH_INPUT: ${{ github.event.inputs.target_branch }}
          CREATE_GITHUB_RELEASE_INPUT: ${{ github.event.inputs.create_github_release }}
          PUBLISH_GALAXY_INPUT: ${{ github.event.inputs.publish_galaxy }}
          AUTO_RELEASE_BUMP: minor
          RELEASE_BOT_LOGIN: ${{ steps.release-bot.outputs.login }}
        run: |
          set -euo pipefail

          bot_login="$RELEASE_BOT_LOGIN"
          if [ "$bot_login" != "lightning-it-release-automation[bot]" ]; then
            echo "::error::Resolved release App bot identity is not the canonical release automation App."
            exit 1
          fi
          gh auth setup-git

          VERSION="${VERSION_INPUT:-}"
          case "$VERSION" in
            v*) VERSION="${VERSION#v}" ;;
          esac
          TARGET_BRANCH="${TARGET_BRANCH_INPUT:-main}"
          CREATE_GITHUB_RELEASE="${CREATE_GITHUB_RELEASE_INPUT:-true}"
          PUBLISH_GALAXY="${PUBLISH_GALAXY_INPUT:-true}"

          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            BASE_BRANCH="main"
          elif [ -n "$BASE_BRANCH_INPUT" ]; then
            BASE_BRANCH="$BASE_BRANCH_INPUT"
          elif git ls-remote --exit-code --heads origin develop >/dev/null 2>&1; then
            BASE_BRANCH="develop"
          else
            BASE_BRANCH="$TARGET_BRANCH"
          fi
          if [ "$TARGET_BRANCH" != "main" ]; then
            echo "::error::Collection release PRs must target main."
            exit 1
          fi

          git config user.name "lightning-it-release-automation[bot]"
          git config user.email "307565056+lightning-it-release-automation[bot]@users.noreply.github.com"
          git fetch origin "$BASE_BRANCH" "$TARGET_BRANCH"
          git switch -C release-prepare-base "origin/$BASE_BRANCH"

          fragment_count="$(
            find changelogs/fragments \
              -maxdepth 1 \
              -type f \
              \( -name '*.yml' -o -name '*.yaml' \) \
              ! -name '.gitkeep' \
              | wc -l
          )"
          if [ "$fragment_count" -eq 0 ]; then
            echo "No changelog fragments found; no collection release PR needed."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$VERSION" ]; then
            VERSION="$(
              python - <<'PY'
          from pathlib import Path
          import os
          import re
          import yaml

          data = yaml.safe_load(Path("galaxy.yml").read_text()) or {}
          current = str(data.get("version", "")).removeprefix("v")
          match = re.fullmatch(
              r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)"
              r"(?:-(?:(?:0|[1-9][0-9]*)|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)"
              r"(?:\.(?:(?:0|[1-9][0-9]*)|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?",
              current,
          )
          if not match:
              raise SystemExit(f"Cannot calculate next version from galaxy.yml version: {current!r}")
          major, minor, patch = map(int, match.groups())
          bump = os.environ.get("AUTO_RELEASE_BUMP", "minor")
          if bump == "major":
              print(f"{major + 1}.0.0")
          elif bump == "patch":
              print(f"{major}.{minor}.{patch + 1}")
          else:
              print(f"{major}.{minor + 1}.0")
          PY
            )"
          fi
          semver_number='(0|[1-9][0-9]*)'
          semver_identifier="(${semver_number}|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)"
          semver_pattern="^${semver_number}\.${semver_number}\.${semver_number}(-${semver_identifier}(\.${semver_identifier})*)?$"
          if ! [[ "$VERSION" =~ $semver_pattern ]]; then
            echo "::error::Version must be semantic versioning, for example 1.2.3."
            exit 1
          fi
          export VERSION

          RELEASE_BRANCH="release/v${VERSION}"
          echo "Preparing release PR for v${VERSION} from ${BASE_BRANCH} to ${TARGET_BRANCH}."

          remote_head_before="$(
            git ls-remote --heads origin "refs/heads/${RELEASE_BRANCH}" \
              | awk 'NR == 1 { print $1 }'
          )"
          git switch -C "$RELEASE_BRANCH" "origin/$BASE_BRANCH"
          RELEASE_BASE_SHA="$(git rev-parse HEAD)"
          export RELEASE_BASE_SHA

          python - <<'PY'
          import os
          from pathlib import Path
          import yaml

          class LintFriendlyDumper(yaml.SafeDumper):
              def increase_indent(self, flow=False, indentless=False):
                  return super().increase_indent(flow, False)

          def write_yaml(path, data):
              path.write_text(
                  yaml.dump(
                      data,
                      Dumper=LintFriendlyDumper,
                      sort_keys=False,
                      explicit_start=True,
                  )
              )

          version = os.environ["VERSION"]
          path = Path("galaxy.yml")
          data = yaml.safe_load(path.read_text())
          data["version"] = version
          write_yaml(path, data)
          PY

          antsibull-changelog lint
          antsibull-changelog release

          python - <<'PY'
          from pathlib import Path
          import yaml

          class LintFriendlyDumper(yaml.SafeDumper):
              def increase_indent(self, flow=False, indentless=False):
                  return super().increase_indent(flow, False)

          for path in (
              Path("galaxy.yml"),
              Path("changelogs/changelog.yaml"),
              Path("changelogs/.plugin-cache.yaml"),
          ):
              if not path.exists():
                  continue
              data = yaml.safe_load(path.read_text())
              path.write_text(
                  yaml.dump(
                      data,
                      Dumper=LintFriendlyDumper,
                      sort_keys=False,
                      explicit_start=True,
                  )
              )
          PY

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "schema_version": 1,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "base_sha": os.environ["RELEASE_BASE_SHA"],
              "next_version": os.environ["VERSION"],
              "preparer": {
                  "login": "lightning-it-release-automation[bot]",
              },
              "workflow": {
                  "source_sha": os.environ["RELEASE_BASE_SHA"],
              },
          }
          Path("changelogs/release-preparation.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          ansible-galaxy collection build --force

          tarball="$(ls ./*.tar.gz)"
          summary="$(
            awk \
              '/^v'"$VERSION"'$/{flag=1; print; next} /^v[0-9]/{if(flag) exit} flag {print}' \
              CHANGELOG.rst
          )"

          git add galaxy.yml changelogs CHANGELOG.rst
          git commit -m "chore(release): prepare v${VERSION}"
          gh auth setup-git
          local_head="$(git rev-parse HEAD)"
          git push \
            --force-with-lease="refs/heads/${RELEASE_BRANCH}:${remote_head_before}" \
            origin "$RELEASE_BRANCH"
          remote_head_after="$(
            git ls-remote --heads origin "refs/heads/${RELEASE_BRANCH}" \
              | awk 'NR == 1 { print $1 }'
          )"
          if [ "$remote_head_after" != "$local_head" ]; then
            echo "::error::Release preparation did not publish the exact local head."
            exit 1
          fi
          branch_advanced=false
          if [ "$remote_head_before" != "$remote_head_after" ]; then
            branch_advanced=true
          fi

          body_file="$(mktemp)"
          {
            echo "## Release v${VERSION}"
            echo
            echo "Base branch: \`${BASE_BRANCH}\`"
            echo "Target branch: \`${TARGET_BRANCH}\`"
            echo "Build artifact: \`${tarball}\`"
            echo "GitHub release creation: \`${CREATE_GITHUB_RELEASE}\`"
            echo "Galaxy publishing: \`${PUBLISH_GALAXY}\`"
            echo
            echo "## Changelog summary"
            echo
            if [ -n "$summary" ]; then
              echo '```rst'
              echo "$summary"
              echo '```'
            else
              echo "See generated changelog files in this PR."
            fi
          } > "$body_file"

          existing="$(
            gh pr list \
              --base "$TARGET_BRANCH" \
              --head "$RELEASE_BRANCH" \
              --state open \
              --json url \
              --jq '.[0].url'
          )"
          expected_base="$(
            git ls-remote --heads origin "refs/heads/${TARGET_BRANCH}" \
              | awk 'NR == 1 { print $1 }'
          )"
          expected_head="$(git rev-parse HEAD)"
          [[ "$expected_base" =~ ^[0-9a-f]{40}$ ]]
          [[ "$expected_head" =~ ^[0-9a-f]{40}$ ]]
          read_release_pr_until_current() {
            local candidate_number="$1"
            local expected_title="$2"
            local attempt
            local candidate_json
            [[ "$candidate_number" =~ ^[1-9][0-9]*$ ]]
            for attempt in 1 2 3 4 5 6; do
              candidate_json=""
              if candidate_json="$(
                gh api "repos/${GITHUB_REPOSITORY}/pulls/${candidate_number}" 2>/dev/null
              )" && jq -e \
                --arg base "$TARGET_BRANCH" \
                --arg bot_login "$bot_login" \
                --argjson candidate_number "$candidate_number" \
                --arg expected_base "$expected_base" \
                --arg expected_head "$expected_head" \
                --arg head "$RELEASE_BRANCH" \
                --arg repository "$GITHUB_REPOSITORY" \
                --arg title "$expected_title" '
                  .user.login == $bot_login
                  and .number == $candidate_number
                  and .state == "open"
                  and .base.ref == $base
                  and .base.sha == $expected_base
                  and .base.repo.full_name == $repository
                  and .head.ref == $head
                  and .head.sha == $expected_head
                  and .head.repo.full_name == $repository
                  and .draft == false
                  and (($title | length) == 0 or .title == $title)
                ' <<< "$candidate_json" >/dev/null; then
                printf '%s\n' "$candidate_json"
                return 0
              fi
              if [ "$attempt" -lt 6 ]; then
                sleep 2
              fi
            done
            echo "::error::Release PR metadata did not converge to the published revision." >&2
            return 1
          }
          validate_existing_release_pr() {
            local candidate="$1"
            local candidate_number
            candidate_number="$(gh pr view "$candidate" --json number --jq .number)"
            read_release_pr_until_current "$candidate_number" "" >/dev/null
          }
          created_pr=false
          if [ -n "$existing" ]; then
            validate_existing_release_pr "$existing"
            gh pr edit "$existing" --title "Release v${VERSION}" --body-file "$body_file"
          else
            existing="$(
              gh pr create \
                --base "$TARGET_BRANCH" \
                --head "$RELEASE_BRANCH" \
                --title "Release v${VERSION}" \
                --body-file "$body_file"
            )"
            created_pr=true
          fi
          release_pr_number="$(gh pr view "$existing" --json number --jq .number)"
          [[ "$release_pr_number" =~ ^[1-9][0-9]*$ ]]
          release_pr="$(
            read_release_pr_until_current "$release_pr_number" "Release v${VERSION}"
          )"
          {
            echo "pr_number=$(jq -r .number <<<"$release_pr")"
            echo "base_ref=$(jq -r .base.ref <<<"$release_pr")"
            echo "expected_base=$(jq -r .base.sha <<<"$release_pr")"
            echo "expected_head=$(jq -r .head.sha <<<"$release_pr")"
            if [ "$branch_advanced" = true ] || [ "$created_pr" = true ]; then
              echo "dispatch_review=true"
            else
              echo "dispatch_review=false"
            fi
          } >>"$GITHUB_OUTPUT"

      # Native common control observes the Release App PR event.
      # Preparation grants no review budget, approval or merge authority.
