---
- name: Exercise protected and legacy runner interface without host or native effects
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    github_runner_url: https://github.com/example
    github_runner_instances:
      - name: legacy
        dir: /opt/legacy-runner
        work_dir: _work-legacy
        labels: [self-hosted, linux]
      - name: protected-example
        protected: true
        ephemeral: true
        rootless_engine:
          subuid_start: 100000
          subgid_start: 100000
        url: https://github.com/example
        dir: /opt/protected-example/runner
        work_dir: /var/lib/protected-example/work
        home: /var/lib/protected-example/home
        storage_dir: /var/lib/protected-example
        manifest_path: /etc/github-runner-protected/example/manifest.json
        user: protected_example
        group: protected_example
        runner_group: Protected
        labels: [self-hosted, linux, arm64]
        operation_reference: example:bounded-operation
        storage_reference: example:private-storage
        custodian_reference: example:reference-is-not-acceptance
        service_state: stopped
  tasks:
    - name: Validate mixed opt-in interface without running the installer
      ansible.builtin.include_role:
        name: lit.ubuntu.github_runner
        tasks_from: assert.yml
        public: true

    - name: Require unchanged legacy routing and version
      ansible.builtin.assert:
        that:
          - github_runner_legacy_instances | map(attribute='name') | list == ['legacy']
          - github_runner_version == '2.335.1'
          - github_runner_protected_version == '2.338.2'

    - name: Keep explicit protected entries for the independent URL contract
      ansible.builtin.set_fact:
        github_runner_contract_protected_only: >-
          {{ github_runner_instances | selectattr('protected', 'defined')
          | selectattr('protected', 'equalto', true) | list }}

    - name: Validate protected-only interface without a legacy global registration URL
      ansible.builtin.include_role:
        name: lit.ubuntu.github_runner
        tasks_from: assert.yml
      vars:
        github_runner_url: ""
        github_runner_instances: "{{ github_runner_contract_protected_only }}"
