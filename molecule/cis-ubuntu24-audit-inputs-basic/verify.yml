---
- name: Verify actual profile and archive admission failures offline
  hosts: all
  gather_facts: false
  tasks:
    - name: Run real profile digest symlink and unprivileged ownership regression cases
      ansible.builtin.command:
        argv:
          - '{{ ansible_playbook_python }}'
          - -m
          - unittest
          - discover
          - -s
          - tests/unit
          - -p
          - test_cis_audit_archive_contract.py
          - -v
        chdir: '{{ lookup("ansible.builtin.env", "MOLECULE_PROJECT_DIRECTORY") }}'
      changed_when: false
