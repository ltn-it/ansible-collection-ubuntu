---
- name: Verify Ubuntu 24 CIS integration
  hosts: cis_ubuntu24
  gather_facts: false
  become: false
  vars:
    ansible_user: root
    ansible_python_interpreter: /usr/bin/python3
  tasks:
    - name: Verify missing profile booleans fail closed
      tags: level1-server
      block:
        - name: Exercise validation without upstream profile booleans
          ansible.builtin.include_role:
            name: lit.ubuntu.cis_ubuntu24
            tasks_from: assert.yml
            apply:
              tags: level1-server
          vars:
            cis_ubuntu24_profile_tag: level1-server
            cis_ubuntu24_execution_mode: remediate
          tags: level1-server

        - name: Fail when missing profile booleans pass validation
          ansible.builtin.fail:
            msg: Missing upstream profile booleans unexpectedly passed validation.
          tags: level1-server
      rescue:
        - name: Verify missing profile booleans use the wrapper failure
          ansible.builtin.assert:
            that:
              - >-
                'Run remediation with exactly'
                in (ansible_failed_result.msg | default(''))
          tags: level1-server

    - name: Verify malformed exception variables fail closed
      tags: level1-server
      block:
        - name: Exercise validation with a missing exception variable name
          ansible.builtin.include_role:
            name: lit.ubuntu.cis_ubuntu24
            tasks_from: assert.yml
            apply:
              tags: level1-server
          vars:
            cis_ubuntu24_profile_tag: level1-server
            cis_ubuntu24_execution_mode: remediate
            ubtu24cis_level_1: true  # noqa: var-naming[no-role-prefix]
            ubtu24cis_level_2: false  # noqa: var-naming[no-role-prefix]
            cis_ubuntu24_exceptions:
              - control_ids:
                  - TEST.2
                scope: molecule
                reason: Exercise fail-closed exception variable validation.
                compensating_control: Molecule checks the wrapper failure.
                variables:
                  - value: false
                audit_visibility: intentional_exception
          tags: level1-server

        - name: Fail when malformed exception variables pass validation
          ansible.builtin.fail:
            msg: Malformed exception variables unexpectedly passed validation.
          tags: level1-server
      rescue:
        - name: Verify malformed variables use the wrapper failure
          ansible.builtin.assert:
            that:
              - >-
                'Each exception variable entry requires'
                in (ansible_failed_result | string)
          tags: level1-server

    - name: Read the upstream invocation evidence
      ansible.builtin.slurp:
        src: /tmp/lit-ubuntu-cis-molecule-result.json
      register: cis_ubuntu24_test_evidence
      tags: level1-server

    - name: Verify the pinned dependency values reached the upstream role
      ansible.builtin.assert:
        that:
          - >-
            (
              cis_ubuntu24_test_evidence.content
              | b64decode
              | from_json
            ).audit_git_version
            == '4eb9eb9e6d3924af7377fc9dd6d3c9f32c63114a'
          - >-
            (
              cis_ubuntu24_test_evidence.content
              | b64decode
              | from_json
            ).audit_file_git
            == 'https://github.com/ansible-lockdown/UBUNTU24-CIS-Audit.git'
      tags: level1-server

    - name: Inspect the non-matching upstream profile evidence
      ansible.builtin.stat:
        path: /tmp/lit-ubuntu-cis-molecule-excluded
      register: cis_ubuntu24_excluded_profile_evidence
      tags: level1-server

    - name: Verify the static import preserves upstream profile filtering
      ansible.builtin.assert:
        that:
          - not cis_ubuntu24_excluded_profile_evidence.stat.exists
      tags: level1-server

    - name: Inspect the AIDE cron service mask
      ansible.builtin.stat:
        path: /etc/systemd/system/dailyaidecheck.service
        follow: false
      register: cis_ubuntu24_aide_service_mask
      tags: level1-server

    - name: Verify the unused static AIDE service is masked
      ansible.builtin.assert:
        that:
          - cis_ubuntu24_aide_service_mask.stat.islnk
          - cis_ubuntu24_aide_service_mask.stat.lnk_source == '/dev/null'
      tags: level1-server

    - name: Inspect the audit log directory
      ansible.builtin.stat:
        path: /tmp/lit-ubuntu-cis-audit-log
      register: cis_ubuntu24_audit_log_directory
      tags: level1-server

    - name: Verify the audit log directory remains traversable
      ansible.builtin.assert:
        that:
          - cis_ubuntu24_audit_log_directory.stat.isdir
          - cis_ubuntu24_audit_log_directory.stat.mode == '0750'
      tags: level1-server

    - name: Read the persistent network kernel controls
      ansible.builtin.slurp:
        src: /tmp/lit-ubuntu-cis-network.conf
      register: cis_ubuntu24_network_sysctls
      tags: level1-server

    - name: Verify the persistent network kernel controls
      ansible.builtin.assert:
        that:
          - >-
            'net.ipv4.conf.all.accept_redirects = 0'
            in (cis_ubuntu24_network_sysctls.content | b64decode)
          - >-
            'net.ipv4.conf.default.accept_source_route = 0'
            in (cis_ubuntu24_network_sysctls.content | b64decode)
          - >-
            'net.ipv4.conf.all.log_martians = 1'
            in (cis_ubuntu24_network_sysctls.content | b64decode)
          - >-
            'net.ipv6.conf.default.accept_ra = 0'
            in (cis_ubuntu24_network_sysctls.content | b64decode)
      tags: level1-server

    - name: Read the applicability-limited network kernel controls
      ansible.builtin.slurp:
        src: /tmp/lit-ubuntu-cis-network-limited.conf
      register: cis_ubuntu24_limited_network_sysctls
      tags: level1-server

    - name: Verify router and IPv6 applicability is preserved
      ansible.builtin.assert:
        that:
          - >-
            'net.ipv4.conf.all.log_martians = 1'
            in (cis_ubuntu24_limited_network_sysctls.content | b64decode)
          - >-
            'accept_source_route'
            not in (cis_ubuntu24_limited_network_sysctls.content | b64decode)
          - >-
            'net.ipv6.'
            not in (cis_ubuntu24_limited_network_sysctls.content | b64decode)
      tags: level1-server

    - name: Seed stale persistent network kernel controls
      ansible.builtin.copy:
        content: stale wrapper-owned controls
        dest: /tmp/lit-ubuntu-cis-network-disabled.conf
        mode: "0644"
      tags: level1-server

    - name: Reconcile persistent controls with undefined upstream inputs
      ansible.builtin.include_role:
        name: lit.ubuntu.cis_ubuntu24
        tasks_from: network_sysctl_persistence.yml
        apply:
          tags: level1-server
      vars:
        cis_ubuntu24_execution_mode: remediate
        cis_ubuntu24_network_sysctl_file: /tmp/lit-ubuntu-cis-network-disabled.conf
      tags: level1-server

    - name: Inspect the disabled persistent network kernel controls
      ansible.builtin.stat:
        path: /tmp/lit-ubuntu-cis-network-disabled.conf
      register: cis_ubuntu24_disabled_network_sysctls
      tags: level1-server

    - name: Verify stale persistent network kernel controls are removed
      ansible.builtin.assert:
        that:
          - not cis_ubuntu24_disabled_network_sysctls.stat.exists
      tags: level1-server
