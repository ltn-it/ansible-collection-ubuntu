---
- name: Run global check-mode firewall validation in the standard verifier path
  hosts: host-firewall.example.test
  become: false
  gather_facts: false
  tasks:
    - name: Produce genuine registered JSON stdout for the coupled preview transport regression
      ansible.builtin.command:
        argv:
          - '{{ ansible_playbook_python }}'
          - -c
          - 'import sys; sys.stdout.write("{\"nftables\":[]}")'
      register: host_firewall_coupled_preview_raw
      changed_when: false

    - name: Derive coupled approval with the actual preview digest task
      ansible.builtin.include_role:
        name: lit.ubuntu.host_firewall
        tasks_from: preview_digest
      vars:
        host_firewall_container_ssh_guard_managed: true

    - name: Check coupled digest against independently hashed exact stdout bytes
      ansible.builtin.command:
        argv:
          - '{{ ansible_playbook_python }}'
          - -c
          - 'import hashlib,sys; assert sys.argv[1] == hashlib.sha256(b"{\"nftables\":[]}").hexdigest()'
          - '{{ host_firewall_preview_readback_sha256 }}'
      changed_when: false

    - name: Produce genuine registered JSON stdout for the single-table preview transport regression
      ansible.builtin.command:
        argv:
          - '{{ ansible_playbook_python }}'
          - -c
          - 'import sys; sys.stdout.write("{\"nftables\":[]}")'
      register: host_firewall_preview_canonical
      changed_when: false

    - name: Derive single-table approval with the actual preview digest task
      ansible.builtin.include_role:
        name: lit.ubuntu.host_firewall
        tasks_from: preview_digest
      vars:
        host_firewall_container_ssh_guard_managed: false

    - name: Check single-table digest against independently hashed exact stdout bytes
      ansible.builtin.command:
        argv:
          - '{{ ansible_playbook_python }}'
          - -c
          - 'import hashlib,sys; assert sys.argv[1] == hashlib.sha256(b"{\"nftables\":[]}").hexdigest()'
          - '{{ host_firewall_preview_readback_sha256 }}'
      changed_when: false

    - name: Execute the dedicated firewall playbook under real global check mode
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python | dirname }}/ansible-playbook"
          - --check
          - --inventory
          - "{{ ansible_inventory_sources | first }}"
          - "{{ playbook_dir }}/check-mode.yml"
      register: host_firewall_global_check
      changed_when: false

    - name: Validate the global check-mode subprocess
      ansible.builtin.assert:
        that:
          - host_firewall_global_check.rc == 0
          - "'failed=0' in host_firewall_global_check.stdout"

- name: Verify host firewall safety contracts
  hosts: host-firewall.example.test
  become: false
  gather_facts: false
  environment:
    PATH: "{{ host_firewall_test_directory }}:/usr/bin:/bin"
  vars_files:
    - vars/egress.yml
  vars:
    host_firewall_test_directory: /tmp/wunder/lit-host-firewall-molecule
    host_firewall_enabled: true
    host_firewall_mode: bootstrap
    host_firewall_expected_inventory_hostname: host-firewall.example.test
    host_firewall_expected_public_ipv4: 192.0.2.10
    host_firewall_expected_management_ipv4: 10.0.30.10
    host_firewall_expected_public_ipv6: ""
    host_firewall_expected_management_ipv6: ""
    host_firewall_observed_ipv4_addresses:
      - 192.0.2.10
      - 10.0.30.10
      - 10.88.0.1
      - 10.88.0.99
      - 10.89.0.1
    host_firewall_observed_ipv6_addresses: []
    host_firewall_observed_container_bridge_gateways_ipv4:
      podman0: 10.88.0.1
      podman1: 10.89.0.1
    host_firewall_platform_name: Ubuntu
    host_firewall_platform_version: "24.04"
    host_firewall_public_interface: enp1s0
    host_firewall_management_interface: enp1s0.4091
    host_firewall_container_interfaces:
      - podman0
      - podman1
    host_firewall_management_access:
      bootstrap_ssh:
        port: 22
        modes: [bootstrap]
        sources_ipv4: [198.51.100.21/32]
        sources_ipv6: []
      openssh:
        port: 1905
        modes: [bootstrap, hardened]
        sources_ipv4: [198.51.100.20/32]
        sources_ipv6: []
      dropbear:
        port: 2222
        modes: [bootstrap, hardened]
        sources_ipv4: [198.51.100.20/32]
        sources_ipv6: []
    host_firewall_tang_access:
      port: 80
      sources_ipv4:
        - 192.0.2.21/32
        - 192.0.2.22/32
        - 192.0.2.23/32
      sources_ipv6: []
    host_firewall_public_service_access:
      https:
        protocol: tcp
        port: 443
        modes: [bootstrap, hardened]
        sources_ipv4: [198.51.100.20/32]
        sources_ipv6: []
    host_firewall_container_service_access:
      guacamole_rdp:
        interfaces: [podman1]
        sources_ipv4: [10.89.0.20/32]
        destination_interface: enp1s0.4091
        destinations_ipv4: [10.0.30.22/32]
        protocol: tcp
        port: 3389
        modes: [bootstrap, hardened]
    host_firewall_control_source_address: 198.51.100.20
    host_firewall_control_destination_port: 1905
    host_firewall_state_directory: /tmp/wunder/lit-host-firewall-molecule/state
    host_firewall_persistent_root_config_path: /tmp/wunder/lit-host-firewall-molecule/nftables.conf
    host_firewall_persistent_include_path: /tmp/wunder/lit-host-firewall-molecule/nftables.d/lit-host-firewall.nft
    host_firewall_test_include_directive: >-
      include "{{ host_firewall_persistent_include_path }}"
    host_firewall_systemd_unit_directory: /tmp/wunder/lit-host-firewall-molecule/systemd
    host_firewall_transaction_program_path: /tmp/wunder/lit-host-firewall-molecule/bin/transaction
    host_firewall_nft_binary: /tmp/wunder/lit-host-firewall-molecule/nft
    host_firewall_systemctl_binary: /tmp/wunder/lit-host-firewall-molecule/systemctl
    host_firewall_python_binary: /usr/bin/python3
    host_firewall_change_id: WBX-G2-MOLECULE
    host_firewall_approved_readback_sha256: 586745c405ef46dbe8af5f7768deaf4b0ea7bcbcb9d9be72d712c36bd52594fa
  pre_tasks:
    - name: Run host firewall transaction unit and race-safety tests
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - -m
          - unittest
          - discover
          - -s
          - "{{ playbook_dir }}/../../tests/unit/roles/host_firewall"
          - -p
          - test_*.py
      environment:
        PYTHONDONTWRITEBYTECODE: "1"
      changed_when: false
  tasks:
    - name: Plan an explicitly managed empty SSH guard without container queries
      ansible.builtin.include_role:
        name: lit.ubuntu.host_firewall
      vars:
        host_firewall_action: plan
        host_firewall_container_ssh_guard_managed: true
        host_firewall_container_ssh_access: {}

    - name: Require both owned tables and no implicit SSH capability
      ansible.builtin.assert:
        that:
          - host_firewall_plan.schema == 'lit.host_firewall.plan/v4'
          - host_firewall_plan.owned_tables | length == 2
          - host_firewall_plan.container_ssh_bindings | length == 0
          - "'destroy table bridge lit_container_ssh_guard' in host_firewall_candidate_content"
          - "'destroy table inet lit_host_firewall' in host_firewall_candidate_content"

    - name: Reject an incomplete legacy container SSH declaration before changes
      block:
        - name: Attempt a managed capability with no selected container identity
          ansible.builtin.include_role:
            name: lit.ubuntu.host_firewall
          vars:
            host_firewall_action: plan
            host_firewall_container_ssh_guard_managed: true
            host_firewall_container_ssh_access:
              console:
                interface: podman1
                source_ipv4: 10.89.0.20/32
                destination_ipv4: 10.89.0.1
                port: 1905
                modes: [bootstrap, hardened]

        - name: Fail when the missing namespace identity was accepted
          ansible.builtin.fail:
            msg: Missing container identity must stop discovery before changes.
      rescue:
        - name: Require the specific read-only discovery rejection
          ansible.builtin.assert:
            that:
              - "'Discover actual active container namespace' in ansible_failed_task.name"
              - not ansible_failed_result.changed
              - (ansible_failed_result.stdout | from_json).discovery_stopped is sameas true
              - (ansible_failed_result.stdout | from_json).mutations is sameas false

    - name: Check complete candidate with the nft command double
      ansible.builtin.include_role:
        name: lit.ubuntu.host_firewall
      vars:
        host_firewall_action: check

    - name: Read nft check execution log
      ansible.builtin.slurp:
        src: "{{ host_firewall_test_directory }}/nft.log"
      register: host_firewall_nft_check_log
      changed_when: false

    - name: Validate real check-mode execution and per-function policy
      ansible.builtin.assert:
        that:
          - not host_firewall_check_result.skipped | default(false)
          - "'--check --file -' in (host_firewall_nft_check_log.content | b64decode)"
          - "'set openssh_sources_v4' in host_firewall_candidate_content"
          - "'set dropbear_sources_v4' in host_firewall_candidate_content"
          - "'@openssh_sources_v4' in host_firewall_candidate_content"
          - "'tcp dport 1905' in host_firewall_candidate_content"
          - "'@dropbear_sources_v4' in host_firewall_candidate_content"
          - "'tcp dport 2222' in host_firewall_candidate_content"
          - "'set public_https_sources_v4' in host_firewall_candidate_content"
          - "'@public_https_sources_v4' in host_firewall_candidate_content"
          - "'tcp dport 443' in host_firewall_candidate_content"
          - "'ip6 ' not in host_firewall_candidate_content"
          - "'nfproto ipv6' not in host_firewall_candidate_content"
          - "'meta nfproto ipv4 ct state { established, related } accept' in host_firewall_candidate_content"
          - "'management_sources_v4' not in host_firewall_candidate_content"
          - "'flush ruleset' not in host_firewall_candidate_content"
          - "'type filter hook output priority 10; policy drop;' in host_firewall_candidate_content"
          - "'ip daddr { 1.1.1.1/32, 8.8.8.8/32 } udp dport 53' in host_firewall_candidate_content"
          - "'ip daddr { 1.1.1.1/32, 8.8.8.8/32 } tcp dport 53' in host_firewall_candidate_content"
          - "'ip daddr { 0.0.0.0/0 } udp dport 123' in host_firewall_candidate_content"
          - "'ip daddr { 10.10.30.24/32 } tcp dport 3100' in host_firewall_candidate_content"
          - "'ip daddr { 0.0.0.0/0 } tcp dport 443' in host_firewall_candidate_content"
          - "'set container_guacamole_rdp_sources_v4' in host_firewall_candidate_content"
          - "'set container_guacamole_rdp_destinations_v4' in host_firewall_candidate_content"
          - >-
            'set container_guacamole_rdp_sources_v4 {\n        type ipv4_addr\n        flags interval'
            in host_firewall_candidate_content
          - >-
            'set container_guacamole_rdp_destinations_v4 {\n        type ipv4_addr\n        flags interval'
            in host_firewall_candidate_content
          - >-
            'iifname { "podman1" } ip saddr @container_guacamole_rdp_sources_v4 oifname "enp1s0.4091"
            ip daddr @container_guacamole_rdp_destinations_v4 tcp dport 3389
            ct state { new, established } accept'
            in host_firewall_candidate_content
          - >-
            'iifname "enp1s0.4091" oifname { "podman1" } meta nfproto ipv4 ip protocol icmp
            icmp type { destination-unreachable, time-exceeded, parameter-problem } ct state related
            ct original ip saddr @container_guacamole_rdp_sources_v4
            ct original ip daddr @container_guacamole_rdp_destinations_v4
            ct original protocol tcp ct original proto-dst 3389 accept'
            in host_firewall_candidate_content
          - >-
            'iifname "enp1s0.4091" ip saddr @container_guacamole_rdp_destinations_v4 oifname { "podman1" }
            ip daddr @container_guacamole_rdp_sources_v4 tcp sport 3389 ct state established accept'
            in host_firewall_candidate_content
          - >-
            'tcp sport 3389 ct state { established, related } accept'
            not in host_firewall_candidate_content
          - host_firewall_plan.new_container_forwarding == 'restricted'

    - name: Render an inactive container-service capability
      ansible.builtin.include_role:
        name: lit.ubuntu.host_firewall
      vars:
        host_firewall_action: check
        host_firewall_container_service_access:
          guacamole_rdp:
            interfaces: [podman1]
            sources_ipv4: [10.89.0.20/32]
            destination_interface: enp1s0.4091
            destinations_ipv4: [10.0.30.22/32]
            protocol: tcp
            port: 3389
            modes: [hardened]

    - name: Validate inactive forwarding is reported and rendered as denied
      ansible.builtin.assert:
        that:
          - host_firewall_plan.new_container_forwarding == 'denied'
          - >-
            'iifname { "podman1" } ip saddr @container_guacamole_rdp_sources_v4 oifname "enp1s0.4091"'
            not in host_firewall_candidate_content
        quiet: true

    - name: Build the hardened proxy egress test policy
      ansible.builtin.set_fact:
        host_firewall_proxy_test_egress_policy: >-
          {{
            host_firewall_egress_policy
            | combine(
                {
                  'status': 'approved',
                  'stance': 'deny-by-default',
                  'functions': host_firewall_egress_policy.functions
                    | combine(
                        {
                          'bootstrap_https': host_firewall_egress_policy.functions.bootstrap_https
                            | combine(
                                {
                                  'enabled': false,
                                  'status': 'disabled-staged-transfer',
                                  'destinations_ipv4': []
                                }
                              )
                        }
                      )
                }
              )
          }}

    - name: Render the direct proxy and container-access candidate
      ansible.builtin.include_role:
        name: lit.ubuntu.host_firewall
      vars:
        host_firewall_action: check
        host_firewall_mode: hardened
        host_firewall_egress_policy: "{{ host_firewall_proxy_test_egress_policy }}"
        host_firewall_forward_proxy_egress:
          enabled: true
          status: approved
          mode: direct
          owner_username: proxy
          interface: enp1s0
          destinations_ipv4: [0.0.0.0/0]
          ports: [80, 443]
          residual: "Owner-bound direct test policy."
        host_firewall_forward_proxy_access:
          enabled: true
          port: 3128
          interfaces: [podman0]
          sources_ipv4: [10.88.0.0/16]
          destination_ipv4: 10.88.0.1
        host_firewall_container_dns_access:
          enabled: true
          interfaces: [podman0]
          sources_ipv4: [10.88.0.0/16]
          destination_ipv4: 10.88.0.1

    - name: Retain the rendered direct proxy candidate
      ansible.builtin.set_fact:
        host_firewall_direct_proxy_candidate: "{{ host_firewall_candidate_content }}"

    - name: Render exact per-client container proxy capabilities
      ansible.builtin.include_role:
        name: lit.ubuntu.host_firewall
      vars:
        host_firewall_action: check
        host_firewall_mode: hardened
        host_firewall_egress_policy: "{{ host_firewall_proxy_test_egress_policy }}"
        host_firewall_forward_proxy_egress:
          enabled: true
          status: approved
          mode: direct
          owner_username: proxy
          interface: enp1s0
          destinations_ipv4: [0.0.0.0/0]
          ports: [80, 443]
          residual: "Owner-bound direct test policy."
        host_firewall_forward_proxy_access:
          enabled: false
          port: 3128
          interfaces: []
          sources_ipv4: []
          destination_ipv4: ""
        host_firewall_forward_proxy_client_access:
          keycloak:
            interface: podman0
            source_ipv4: 10.88.0.11/32
            destination_ipv4: 10.88.0.1
            port: 3128
            modes: [hardened]
          guacamole:
            interface: podman1
            source_ipv4: 10.89.0.20/32
            destination_ipv4: 10.89.0.1
            port: 3128
            modes: [hardened]

    - name: Retain the exact per-client proxy candidate
      ansible.builtin.set_fact:
        host_firewall_exact_proxy_candidate: "{{ host_firewall_candidate_content }}"

    - name: Render the chained upstream proxy candidate
      ansible.builtin.include_role:
        name: lit.ubuntu.host_firewall
      vars:
        host_firewall_action: check
        host_firewall_mode: hardened
        host_firewall_egress_policy: "{{ host_firewall_proxy_test_egress_policy }}"
        host_firewall_forward_proxy_egress:
          enabled: true
          status: approved
          mode: upstream
          owner_username: proxy
          interface: enp1s0.4091
          destinations_ipv4: [10.0.30.25/32]
          ports: [8080]
          residual: "Owner-bound customer upstream test policy."
        host_firewall_forward_proxy_access:
          enabled: false
          port: 3128
          interfaces: []
          sources_ipv4: []
          destination_ipv4: ""
        host_firewall_forward_proxy_client_access: {}

    - name: Validate rendered direct and upstream proxy boundaries
      ansible.builtin.assert:
        that:
          - >-
            'meta skuid ' ~ (ansible_facts.getent_passwd.proxy[1] | string)
            ~ ' oifname "enp1s0" ip daddr { 0.0.0.0/0 } tcp dport { 80, 443 }'
            in host_firewall_direct_proxy_candidate
          - "'set forward_proxy_clients_v4' in host_firewall_direct_proxy_candidate"
          - "'set container_dns_clients_v4' in host_firewall_direct_proxy_candidate"
          - >-
            'iifname { "podman0" } ip saddr @forward_proxy_clients_v4 ip daddr 10.88.0.1 tcp dport 3128'
            in host_firewall_direct_proxy_candidate
          - >-
            'iifname { "podman0" } ip saddr @container_dns_clients_v4 ip daddr 10.88.0.1 udp dport 53'
            in host_firewall_direct_proxy_candidate
          - >-
            'iifname { "podman0" } ip saddr @container_dns_clients_v4 ip daddr 10.88.0.1 tcp dport 53'
            in host_firewall_direct_proxy_candidate
          - >-
            'oifname "enp1s0" ip daddr { 0.0.0.0/0 } tcp dport 443 ct state new accept'
            not in host_firewall_direct_proxy_candidate
          - >-
            'iifname "podman0" ip saddr 10.88.0.11/32 ip daddr 10.88.0.1 tcp dport 3128 ct state new accept'
            in host_firewall_exact_proxy_candidate
          - >-
            'iifname "podman1" ip saddr 10.89.0.20/32 ip daddr 10.89.0.1 tcp dport 3128 ct state new accept'
            in host_firewall_exact_proxy_candidate
          - "'set forward_proxy_clients_v4' not in host_firewall_exact_proxy_candidate"
          - >-
            'meta skuid ' ~ (ansible_facts.getent_passwd.proxy[1] | string)
            ~ ' oifname "enp1s0.4091" ip daddr { 10.0.30.25/32 } tcp dport { 8080 }'
            in host_firewall_candidate_content
          - "'set forward_proxy_clients_v4' not in host_firewall_candidate_content"
          - "'set container_dns_clients_v4' not in host_firewall_candidate_content"
        quiet: true

    - name: Prove an exact proxy client cannot target another bridge gateway
      block:
        - name: Attempt a cross-bridge proxy gateway binding
          ansible.builtin.include_role:
            name: lit.ubuntu.host_firewall
          vars:
            host_firewall_action: check
            host_firewall_mode: hardened
            host_firewall_egress_policy: "{{ host_firewall_proxy_test_egress_policy }}"
            host_firewall_forward_proxy_egress:
              enabled: true
              status: approved
              mode: direct
              owner_username: proxy
              interface: enp1s0
              destinations_ipv4: [0.0.0.0/0]
              ports: [80, 443]
              residual: "Owner-bound direct test policy."
            host_firewall_forward_proxy_access:
              enabled: false
              port: 3128
              interfaces: []
              sources_ipv4: []
              destination_ipv4: ""
            host_firewall_forward_proxy_client_access:
              invalid_cross_bridge:
                interface: podman0
                source_ipv4: 10.88.0.11/32
                destination_ipv4: 10.89.0.1
                port: 3128
                modes: [hardened]

        - name: Fail when the cross-bridge proxy gateway was accepted
          ansible.builtin.fail:
            msg: "An exact proxy client unexpectedly targeted another bridge gateway."

      rescue:
        - name: Confirm gateway binding rejected the cross-bridge destination
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Bind exact container proxy clients to observed bridge gateways'
            quiet: true

    - name: Exercise every exact proxy-client validation boundary
      ansible.builtin.include_tasks: tasks/reject-proxy-client.yml
      loop_control:
        loop_var: host_firewall_proxy_rejection_case
        label: "{{ host_firewall_proxy_rejection_case.name }}"
      loop:
        - name: aggregate-and-client-coexistence
          aggregate:
            enabled: true
            port: 3128
            interfaces: [podman0]
            sources_ipv4: [10.88.0.0/16]
            destination_ipv4: 10.88.0.1
          clients:
            invalid:
              interface: podman0
              source_ipv4: 10.88.0.11/32
              destination_ipv4: 10.88.0.1
              port: 3128
              modes: [hardened]
          expected_failed_task: Validate exact per-client container proxy capabilities
        - name: globally-routable-source
          aggregate: &disabled_aggregate
            enabled: false
            port: 3128
            interfaces: []
            sources_ipv4: []
            destination_ipv4: ""
          clients:
            invalid:
              interface: podman0
              source_ipv4: 203.0.113.11/32
              destination_ipv4: 10.88.0.1
              port: 3128
              modes: [hardened]
          expected_failed_task: Validate exact per-client container proxy source identities
        - name: non-host-source-prefix
          aggregate: *disabled_aggregate
          clients:
            invalid:
              interface: podman0
              source_ipv4: 10.88.0.0/24
              destination_ipv4: 10.88.0.1
              port: 3128
              modes: [hardened]
          expected_failed_task: Validate exact per-client container proxy capabilities
        - name: privileged-port
          aggregate: *disabled_aggregate
          clients:
            invalid:
              interface: podman0
              source_ipv4: 10.88.0.11/32
              destination_ipv4: 10.88.0.1
              port: 80
              modes: [hardened]
          expected_failed_task: Validate exact per-client container proxy capabilities
        - name: unreachable-bootstrap-mode
          aggregate: *disabled_aggregate
          clients:
            invalid:
              interface: podman0
              source_ipv4: 10.88.0.11/32
              destination_ipv4: 10.88.0.1
              port: 3128
              modes: [bootstrap]
          expected_failed_task: Validate exact per-client container proxy capabilities

    - name: Prove container DNS cannot target a public host identity
      block:
        - name: Attempt to render container DNS access to the public address
          ansible.builtin.include_role:
            name: lit.ubuntu.host_firewall
          vars:
            host_firewall_action: check
            host_firewall_mode: hardened
            host_firewall_egress_policy: "{{ host_firewall_proxy_test_egress_policy }}"
            host_firewall_container_dns_access:
              enabled: true
              interfaces: [podman0]
              sources_ipv4: [10.88.0.0/16]
              destination_ipv4: 192.0.2.10

        - name: Fail when public-address container DNS access was accepted
          ansible.builtin.fail:
            msg: "Container DNS unexpectedly targeted the public host address."

      rescue:
        - name: Confirm the container DNS boundary rejected the public address
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Validate container access to the host-local Aardvark DNS listener'
            quiet: true

    - name: Prove an observed non-gateway address cannot authorize container DNS
      block:
        - name: Attempt to render container DNS access to an observed non-gateway address
          ansible.builtin.include_role:
            name: lit.ubuntu.host_firewall
          vars:
            host_firewall_action: check
            host_firewall_mode: hardened
            host_firewall_egress_policy: "{{ host_firewall_proxy_test_egress_policy }}"
            host_firewall_container_dns_access:
              enabled: true
              interfaces: [podman0]
              sources_ipv4: [10.88.0.0/16]
              destination_ipv4: 10.88.0.99

        - name: Fail when observed non-gateway container DNS access was accepted
          ansible.builtin.fail:
            msg: "Container DNS unexpectedly targeted an observed non-gateway address."

      rescue:
        - name: Confirm bridge-specific evidence rejected the observed non-gateway address
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Validate container access to the host-local Aardvark DNS listener'
            quiet: true

    - name: Prove selected container DNS bridges must share one observed gateway
      block:
        - name: Attempt container DNS access across bridges with distinct gateways
          ansible.builtin.include_role:
            name: lit.ubuntu.host_firewall
          vars:
            host_firewall_action: check
            host_firewall_mode: hardened
            host_firewall_egress_policy: "{{ host_firewall_proxy_test_egress_policy }}"
            host_firewall_container_dns_access:
              enabled: true
              interfaces: [podman0, podman1]
              sources_ipv4: [10.88.0.0/16, 10.89.0.0/16]
              destination_ipv4: 10.88.0.1

        - name: Fail when distinct bridge gateways were accepted
          ansible.builtin.fail:
            msg: "Container DNS unexpectedly accepted distinct selected bridge gateways."

      rescue:
        - name: Confirm distinct selected bridge gateways were rejected
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Validate container access to the host-local Aardvark DNS listener'
            quiet: true

    - name: Render container DNS across selected bridges with one observed gateway
      ansible.builtin.include_role:
        name: lit.ubuntu.host_firewall
      vars:
        host_firewall_action: check
        host_firewall_mode: hardened
        host_firewall_egress_policy: "{{ host_firewall_proxy_test_egress_policy }}"
        host_firewall_observed_container_bridge_gateways_ipv4:
          podman0: 10.88.0.1
          podman1: 10.88.0.1
        host_firewall_container_dns_access:
          enabled: true
          interfaces: [podman0, podman1]
          sources_ipv4: [10.88.0.0/16, 10.89.0.0/16]
          destination_ipv4: 10.88.0.1

    - name: Confirm matching selected bridge gateways render successfully
      ansible.builtin.assert:
        that:
          - >-
            'iifname { "podman0", "podman1" } ip saddr @container_dns_clients_v4 ip daddr 10.88.0.1 udp dport 53'
            in host_firewall_candidate_content
          - >-
            'iifname { "podman0", "podman1" } ip saddr @container_dns_clients_v4 ip daddr 10.88.0.1 tcp dport 53'
            in host_firewall_candidate_content
        quiet: true

    - name: Prove invalid local proxy identities fail before rendering
      ansible.builtin.include_tasks: verify-forward-proxy-identity.tasks.yml.inc
      loop:
        - name: wrong UID
          passwd_records:
            - "proxy:x:14:13:Wrong UID:/nonexistent:/usr/sbin/nologin"
        - name: wrong GID
          passwd_records:
            - "proxy:x:13:14:Wrong GID:/nonexistent:/usr/sbin/nologin"
        - name: login-capable shell
          passwd_records:
            - "proxy:x:13:13:Login shell:/nonexistent:/bin/bash"
        - name: duplicate UID
          passwd_records:
            - "proxy:x:13:13:Forward proxy:/nonexistent:/usr/sbin/nologin"
            - "proxy-shadow:x:13:13:Duplicate UID:/nonexistent:/usr/sbin/nologin"
      loop_control:
        loop_var: host_firewall_invalid_identity_case
        label: "{{ host_firewall_invalid_identity_case.name }}"

    - name: Confirm every IPv6 source fails the end-to-end IPv4-only boundary
      block:
        - name: Attempt plan with one IPv6 management source
          ansible.builtin.include_role:
            name: lit.ubuntu.host_firewall
          vars:
            host_firewall_action: plan
            host_firewall_expected_public_ipv6: 2001:db8::10
            host_firewall_observed_ipv6_addresses: [2001:db8::10]
            host_firewall_management_access:
              bootstrap_ssh:
                port: 22
                modes: [bootstrap]
                sources_ipv4: [198.51.100.21/32]
                sources_ipv6: []
              openssh:
                port: 1905
                modes: [bootstrap, hardened]
                sources_ipv4: [198.51.100.20/32]
                sources_ipv6: [2001:db8::20/128]
              dropbear:
                port: 2222
                modes: [bootstrap, hardened]
                sources_ipv4: [198.51.100.20/32]
                sources_ipv6: []

        - name: Fail when an IPv6 source was accepted
          ansible.builtin.fail:
            msg: "An IPv6 management source unexpectedly passed the IPv4-only boundary."

      rescue:
        - name: Validate end-to-end IPv4-only source rejection
          ansible.builtin.assert:
            that:
              - ansible_failed_result is failed
              - "'authorizes IPv4 only' in ansible_failed_result.msg"

    - name: Confirm deprecated aggregate sources fail closed
      block:
        - name: Attempt plan with deprecated aggregate management source
          ansible.builtin.include_role:
            name: lit.ubuntu.host_firewall
          vars:
            host_firewall_action: plan
            host_firewall_controller_source_cidrs:
              - 198.51.100.20/32

        - name: Fail when deprecated aggregate source was accepted
          ansible.builtin.fail:
            msg: "Deprecated aggregate management source unexpectedly passed."

      rescue:
        - name: Validate fail-closed aggregate-source migration boundary
          ansible.builtin.assert:
            that:
              - ansible_failed_result is failed

    - name: Confirm broad management IPv4 sources fail closed
      block:
        - name: Attempt plan with unsafe address ranges
          ansible.builtin.include_role:
            name: lit.ubuntu.host_firewall
          vars:
            host_firewall_action: plan
            host_firewall_management_access:
              bootstrap_ssh:
                port: 22
                modes: [bootstrap]
                sources_ipv4: [0.0.0.0/0]
                sources_ipv6: []
              openssh:
                port: 1905
                modes: [bootstrap, hardened]
                sources_ipv4: [198.51.100.20/32]
                sources_ipv6: [2001:db8::20/128]
              dropbear:
                port: 2222
                modes: [bootstrap, hardened]
                sources_ipv4: [198.51.100.20/32]
                sources_ipv6: []

        - name: Fail when unsafe address ranges were accepted
          ansible.builtin.fail:
            msg: "Unsafe IPv4/IPv6 source unexpectedly passed."

      rescue:
        - name: Validate exact-host management boundary
          ansible.builtin.assert:
            that:
              - ansible_failed_result is failed

    - name: Restore canonical inputs after isolated negative tests
      ansible.builtin.set_fact:
        host_firewall_expected_public_ipv4: 192.0.2.10
        host_firewall_expected_management_ipv4: 10.0.30.10
        host_firewall_expected_public_ipv6: ""
        host_firewall_expected_management_ipv6: ""
        host_firewall_observed_ipv4_addresses: [192.0.2.10, 10.0.30.10]
        host_firewall_observed_ipv6_addresses: []
        host_firewall_control_source_address: 198.51.100.20
        host_firewall_management_access:
          bootstrap_ssh:
            port: 22
            modes: [bootstrap]
            sources_ipv4: [198.51.100.21/32]
            sources_ipv6: []
          openssh:
            port: 1905
            modes: [bootstrap, hardened]
            sources_ipv4: [198.51.100.20/32]
            sources_ipv6: []
          dropbear:
            port: 2222
            modes: [bootstrap, hardened]
            sources_ipv4: [198.51.100.20/32]
            sources_ipv6: []
        host_firewall_tang_access:
          port: 80
          sources_ipv4:
            - 192.0.2.21/32
            - 192.0.2.22/32
            - 192.0.2.23/32
          sources_ipv6: []

    - name: Confirm exact authorization contract still fails without trusted signature verifier
      block:
        - name: Attempt productive apply with exact unsigned contract
          ansible.builtin.include_role:
            name: lit.ubuntu.host_firewall
          vars:
            host_firewall_action: apply
            host_firewall_authorization_contract:
              schema: lit.host_firewall.authorization/v1
              target: host-firewall.example.test
              action: apply
              candidate_sha256: "{{ host_firewall_candidate_sha256 }}"
              approved_readback_sha256: "{{ host_firewall_approved_readback_sha256 }}"
              policy_fingerprint: "{{ host_firewall_policy_fingerprint }}"
              change_id: WBX-G2-MOLECULE

        - name: Fail when unsigned productive action was accepted
          ansible.builtin.fail:
            msg: "Unsigned productive firewall action unexpectedly passed."

      rescue:
        - name: Validate unavailable signer blocks productive mutation
          ansible.builtin.assert:
            that:
              - ansible_failed_result is failed
              - "'exact signed v2 envelope' in ansible_failed_result.msg"

    - name: Read back canonical approved nftables JSON
      ansible.builtin.include_role:
        name: lit.ubuntu.host_firewall
      vars:
        host_firewall_action: readback

    - name: Validate canonical approved readback
      ansible.builtin.assert:
        that:
          - host_firewall_readback_sha256 == host_firewall_approved_readback_sha256

    - name: Install structured readback drift fixture
      ansible.builtin.copy:
        dest: "{{ host_firewall_test_directory }}/runtime.json"
        mode: "0600"
        content: |
          {{ _host_firewall_drift_fixture | to_json }}
      vars:
        _host_firewall_drift_fixture:
          nftables:
            - table:
                family: inet
                name: lit_host_firewall
            - chain:
                family: inet
                table: lit_host_firewall
                name: input
                type: filter
                hook: input
                prio: 10
                policy: accept

    - name: Confirm structured policy drift fails closed
      block:
        - name: Attempt readback of drifted structured policy
          ansible.builtin.include_role:
            name: lit.ubuntu.host_firewall
          vars:
            host_firewall_action: readback

        - name: Fail when structured policy drift was accepted
          ansible.builtin.fail:
            msg: "Drifted structured policy unexpectedly passed."

      rescue:
        - name: Validate canonical drift rejection
          ansible.builtin.assert:
            that:
              - ansible_failed_result is failed

    - name: Install foreign-table readback fixture
      ansible.builtin.copy:
        dest: "{{ host_firewall_test_directory }}/runtime.json"
        mode: "0600"
        content: |
          {{ _host_firewall_foreign_fixture | to_json }}
      vars:
        _host_firewall_foreign_fixture:
          nftables:
            - table:
                family: inet
                name: foreign_table

    - name: Confirm foreign table cannot satisfy owned-table readback
      block:
        - name: Attempt readback of foreign table fixture
          ansible.builtin.include_role:
            name: lit.ubuntu.host_firewall
          vars:
            host_firewall_action: readback

        - name: Fail when foreign table was accepted
          ansible.builtin.fail:
            msg: "Foreign table unexpectedly passed owned-table readback."

      rescue:
        - name: Validate foreign-table boundary rejection
          ansible.builtin.assert:
            that:
              - ansible_failed_result is failed

    - name: Plan exact published HTTPS without unrelated container forwarding
      ansible.builtin.include_role:
        name: lit.ubuntu.host_firewall
      vars:
        host_firewall_action: plan
        host_firewall_container_service_access: {}
        host_firewall_published_https_access:
          enabled: true
          endpoints:
            - interface: podman0
              ipv4: 10.88.0.2
          host_proxy: false

    - name: Validate the plan reports only the declared DNAT ingress
      ansible.builtin.assert:
        that:
          - host_firewall_plan.new_container_forwarding == 'restricted'
          - "'ct status dnat' in host_firewall_candidate_content"
          - "'ct original ip daddr 192.0.2.10' in host_firewall_candidate_content"
          - "'ct original protocol tcp ct original proto-dst 443' in host_firewall_candidate_content"
          - "'set container_guacamole_rdp_sources_v4' not in host_firewall_candidate_content"
          - "'ct status dnat' not in host_firewall_candidate_content.split('chain output {')[1]"

    - name: Plan published HTTPS outside its permitted operating mode
      ansible.builtin.include_role:
        name: lit.ubuntu.host_firewall
      vars:
        host_firewall_action: plan
        host_firewall_container_service_access: {}
        host_firewall_published_https_access:
          enabled: true
          endpoints:
            - interface: podman0
              ipv4: 10.88.0.2
          host_proxy: false
        host_firewall_public_service_access:
          https:
            protocol: tcp
            port: 443
            modes: [hardened]
            sources_ipv4: [198.51.100.20/32]
            sources_ipv6: []

    - name: Validate inactive published ingress stays denied
      ansible.builtin.assert:
        that:
          - host_firewall_plan.new_container_forwarding == 'denied'
          - "'ct status dnat' not in host_firewall_candidate_content"

    - name: Read administrator-owned root config after all safe checks
      ansible.builtin.slurp:
        src: "{{ host_firewall_persistent_root_config_path }}"
      register: host_firewall_root_config_after_checks
      changed_when: false

    - name: Validate foreign root policy and exact include remain untouched
      ansible.builtin.assert:
        that:
          - "'table inet foreign_table' in (host_firewall_root_config_after_checks.content | b64decode)"
          - >-
            (host_firewall_root_config_after_checks.content | b64decode).splitlines()
            | select('equalto', host_firewall_test_include_directive)
            | list
            | length == 1
